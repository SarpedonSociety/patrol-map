events:
  - date: January 16, 1943
    time: "0610"
    zone: I
    tag: notable
    title: "Flooded through the conning tower hatch"
    page: "5-6"
    event: "0610(I) following quick dive, took water through upper conning tower hatch into control room and pump room. Casualty caused by QM dogging the hatch before it was closed. After hatch was secured, surfaced. Attained maximum depth of 43 feet. At 0612(I) Commenced freeing pump room bilges of water by bailing. The below listed casualties resulted from flooding: [list under Damage]. 0717(I) Submerged. Commenced repairing and cleaning flooded machinery. At 1908(I) Surfaced."
    damage: "1. 200# Air Compressor and Motor - flooded. 2. Gyro Compass - Binnacle flooded. Follow-up system grounded. Azimuth motor burned out. 3. Pump room power distribution panel - flooded. 4. Both Air Conditioning motors and motor control panels - flooded. 5. #1 Periscope lower limit switch - grounded. 6. Drain pump control panel - flooded. 7. #1 H.P. Air Compressor motor - flooded. 8. #2 H.P. Air Compressor motor controller - flooded. 9. General announcing system - grounded. 10. JK-QC training motor generator - flooded. 11. TBL motor generator and power supply panels - flooded. 12. Commissary storeroom under control room - flooded, with loss of 750 pounds of sugar, 200 pounds of dried beans, prunes and dried peaches."
    flags: "Hand transcription, Fold3 images 268550843-268550847. Comsubdiv 101 (Enclosure B, para. 3): 'The failure to properly close the conning tower hatch on January 16. is a type of casualty that has occured on many submarines. The primary cause is a latch requiring lubrication, together with an over-eagerness to slam the hatch.' The war history adds that the ice machine was damaged and food spoiled, leaving rice and hot cakes three times a day for the last two weeks."
  - date: January 17, 1943
    time: "2143"
    zone: I
    tag: gun
    title: "Night battle surface on a patrol boat"
    page: "6"
    event: "2130(I) Sighted light bearing 045°T. and rel. Changed course to close, and at 2134(I) Identified vessel as patrol boat with familiar box structure aft. SJ Radar picked up vessel at a range of 3400 yards. At 2136(I) Submerged. Closed target and continued ranging with SJ Radar. At 2143(I) With vessel about 1000 yards distant, bearing 330° rel., made battle surface. Opened fire with 4\" gun and 20 MM machine gun. The weather was clear, with no moon. The 4\" gun pointer reported that the light of the 20 MM tracers and explosions were blinding. Smoke frequently obscured the target after 4\" shell hits. No fire was observed. At"
    flags: "Hand transcription, Fold3 image 268550847. The entry continues on report page 7, not transcribed. Comsubdiv 101 (Enclosure B, para. 4): 'The night battle surface, gun attack on the sampan patrol boat was very well conducted.'"

