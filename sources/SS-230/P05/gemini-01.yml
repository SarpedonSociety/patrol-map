    tag: attack
    title: "Stern tube torpedo attack"
    part: I
    charges:
    damage:
    course:
    speed:
    event: "fired three torpedo spread from stern tubes at range of 3,500 yards, track of 90° starboard, and gyro angle of 191. No hits. The target zigged away at this time. The first torpedo we tracked out running straight for about 2,000 yards and then it gradually drew around to the right. When sound reported the torpedo screws bearing 243° relative and getting louder, went to 140 feet to avoid torpedo. While passing 100 feet, a torpedo explosion was heard at an estimated range of 1,000 yards. A second torpedo explosion followed in about thirty five seconds at about the same range. The time of run of these torpedoes indicated they had reached the end of their run. This poor performance as regards hits is attributed to the following: (a) Poor torpedo performance. (b) Too great a firing range. (c) Firing torpedo on a \"knuckle\". (d) Disadvantage of having only torpedoes aft."
    page: 12
    flags: ""
