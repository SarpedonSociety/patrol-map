    tag: attack
    title: "Torpedo attack on freighter"
    part: I
    charges:
    damage:
    course:
    speed:
    event: "fired three torpedo spread with 100° port track, speed of 11 3/4 knots, and actual range of 1,150 yards. All torpedoes were set on 15 feet. The first torpedo hit amidships with a terrific explosion, but the second and third torpedoes missed. The second torpedo was tracked ahead of the screws by sound. The target's screws were not heard after the torpedo explosion. It is believed that the target was drawing less than was estimated and the one hit was an influence explosion. The other two torpedoes probably ran too deep. The draft was estimated at 13 feet and torpedoes were set at 15 feet to run at 12 feet. The target could have had a draft of 10 feet. Although the target was not seen to sink and cannot be credited as such, it is believed that there is a strong possibility a torpex hit amidships sank him."
    page: 5
    flags: "Heading includes Attack #2. Entry text spans pages 5 and 6"
