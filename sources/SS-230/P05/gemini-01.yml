  - date: 08JUN
    time: 0227
    zone: I
    lat:
    lon:
    from:
    bearing:
    distance:
    bearing_is:
    tag: attack
    title: "Surface torpedo attack on convoy"
    part: I
    charges:
    damage:
    course:
    speed:
    event: "fired a three torpedo spread at each of two leading ships which almost presented an overlapping target. Range to nearest target 1,500 yards; track 100° starboard; gyro angle 011; and range to far target 2,300 yards. Swung hard left at flank speed to clear two after ships, who had a smaller angle on bow, and to try a stern tube shot. Cleared nearest ship 600 yards (by radar) when we were beam to beam. Already had two stern tubes ready and set on 10 feet in case our escort got too friendly."
    page: 8
    flags: "Heading includes Attacks #3-4 (typed \"Attacks # 3-4))"
  - date: 08JUN
    time: 0232
    zone: I
    lat:
    lon:
    from:
    bearing:
    distance:
    bearing_is:
    tag: attack
    title: "Stern tube torpedo attack on convoy"
    part: I
    charges:
    damage:
    course:
    speed:
    event: "fired two torpedoes while still swinging at overlapping after ships. Total results one hit on nearest leading target (Lima Maru Class); two hits on farthest leading target (Yuki Maru); and one hit on farthest after target (Heian Maru class). These hits were seen, heard, and checked by time of torpedo run. The last ship hit was seen taking a down angle as we retired to southwest at full speed. We had four strong pips on the radar from the four freighters as we pulled away. The escort had never been easy to pick up on radar. He was first picked up during the approach at 7,000 yards. When the range to the nearest target was 3,000 yards, we ran into a rain squall. Heard two distant explosions which sounded like depth charges. The radar officer reported two of the pips getting weaker. Between 5,000 and 7,000 yards, we lost two pips. At 9,000 yards, since the escort did not seem to be on our trail, we stopped. A careful and continuous search over the target area, failed to reveal more than two pips indicating that two ships had sunk. All ships had shown up plainly on the radar screen at 13,500 yards during the tracking. All torpedoes fired had torpex heads which exploded with a terrific noise. The large remaining pip, which was believed to be on the largest ship (Lima Maru class one hit) moved slowly out to 17,500 yards and disappeared. The other pip closed us slowly to 8,500 yards and then opened out and was lost at 13,700 yards. It is believed that this ship was the undamaged one taking a quick look for survivors."
    page: 8
    flags: "Entry text spans pages 8 and 9"
