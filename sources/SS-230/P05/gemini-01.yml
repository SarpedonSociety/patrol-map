    event: "with escort passing ahead at 400 yards, right hand ship with zero angle on bow, range 2,000 yards, center ship with 20° port angle on bow, range 3,000 yards, and left hand ship 80° port angle on bow, 1,200 yards, fired three torpedoes (TNT heads) at left hand ship. 1st torpedo jumped clear of the water twice at about 400 yards, just astern of the escort and later prematured, the 2nd torpedo hit, and the 3rd torpedo missed. The escort started turning toward us after 1st torpedo prematured. Went deep to avoid ramming and to evade depth charge attack. Our going under one ship and astern of another seemed to confuse the escort. He dropped four depth charges, but none were very close. The escort then commenced searching with supersonic. He seemed to be strictly amateur."
