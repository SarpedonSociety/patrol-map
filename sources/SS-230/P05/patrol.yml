  - { date: 6-7-43, time: "1732", zone: Z, target: Freighter, result: sunk, tons: 5400, basis: claimed, source: "Attack 5, page 20" }
  - { date: 6-8-43, time: "0947", zone: Z, target: Passenger, result: damaged, tons: 6370, basis: claimed, source: "Attack 6, page 20" }
