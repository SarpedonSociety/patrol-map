# USS Finback (SS-230), War Patrol 5
# Transcribed by Gemini in a fresh chat: gemini-01.yml (narrative, pages
# 1-14) and contacts-01.md (contact, aircraft and attack tables, pages
# 16-20). Hand entries here take precedence.

boat: SS-230
patrol: 5
year: 1943
report_found: yes
report:
comsubpac_report_no:
commanding_officer:

# The attack summary prints a time with each date but no zone. Every one
# is nine hours behind the narrative's zone I time for the same attack
# (Attack 1: 1717 on 5-26 against 0217 I on 27 May), so they are GCT.
table_zones: { SUMMARY OF SUBMARINE ATTACKS: Z }

departure:
  port: Pearl Harbor
  date: 12MAY
  time: "1000"
  zone: VX
  page: 1
  flags: "Zone typed VX. Read as Hawaiian time (GMT minus 10½), as Silversides' VW is; check what VX meant."

period:
  start: 1943-05-12
  end: 1943-06-26
  source: "Patrol report"

# Claimed tonnage from the attack summary, pages 19-20. Times are GCT.
