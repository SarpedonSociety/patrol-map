events:
  # The latitude and longitude in this entry are the oil barge's, not the
  # rendezvous position; the barge position goes with the mooring at 1301.
  - replaces: { date: 23JUN, time: "0800" }
    date: 23JUN
    time: "0800"
    zone: H
    from: Vlaming Head Light
    bearing: north
    distance: five miles
    bearing_is: from_landmark
    tag: notable
    title: Met USS Isabel for escort
    part: I
    event: "made rendezvous with U.S.S. ISABEL five miles north of Vlaming Head Light. Proceeded under escort to oil barge in Exmouth Gulf (Approximate location - Lat. 22°-11 ( ) Long. 114°-09 ( )) for fuel."
    page: 13
    flags: "Hemisphere letters blank in the source. The lat/long given is the oil barge's approximate position; used at 1301 instead. An escort meeting, so not tagged as a rendezvous."
  - replaces: { date: 23JUN, time: "1301" }
    date: 23JUN
    time: "1301"
    zone: H
    lat: 22-11 S
    lon: 114-09 E
    part: I
    event: "moored along side tanker."
    page: 14
    flags: "Position is the report's approximate location of the oil barge in Exmouth Gulf (page 13; hemispheres blank, south and east from the geography)."
