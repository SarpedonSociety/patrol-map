    event: "with escort at 2,000 yards, fired three torpedo spreads from bow tubes with following setup: track angle 95° (S); range 1,700 yards; gyro angle 4° right; and depth setting of 12 feet. All torpedoes seemed to run normally and looked good. Results - No hits. With the spreads used, the consistency of our data, and actual torpedo tracks observed, the commanding officer believes it was impossible to get three misses unless the torpedoes ran too deep. A subsequent careful check-up of all personnel and data has not revealed any explanation for three misses. When the third torpedo left the tube, swung ship hard right at flank speed and placed target astern."
