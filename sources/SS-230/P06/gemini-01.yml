    charges: 
    damage: 
    with: 
    course: 
    speed: 
    event: "fired two torpedoes from after tubes by applying lead angle on after T.D.T. and using zero gyro angles. Results two hits. The first torpedo hit amidships giving off a large amount of flame. The second torpedo hit well aft. The target was covered with black smoke, but seemed to start down aft at once. All hands on bridge watched bow rise out of water and then the target took its final plunge. At the same time the radar officer watched his pip increase and then disappear. The target sank in two and one-half minutes. Apparently neither the target, who was closed to 1,300 yards, nor the escort who closed us to 2,400 yards, with a broadsideview, ever saw us. The escort charged off astern of target dropping depth charges to a total of nine. They sound fine when you are on the surface. Cleared area to north, got off message to CTF 71.1, and headed east so as to be able to clear area the next night."
