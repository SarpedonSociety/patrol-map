    speed:
    event: "just as ship was turning northward to patrol the following day off Pomalaa, Celebes, picked up target on radar at 3,750 yards, 034° relative. At that time we sighted a patrol vessel visually for the first time and turned away. When the commanding officer arrived on the bridge, he found a patrol vessel with a big bow wave bearing down with zero angle on the bow and range of 2,700 yards. The range opened fairly rapidly as four Fairbanks-Morse engines warmed up. At a range of about 3,500 yards, the patrol vessel presented a 10° angle on the bow and opened fired with a gun of about 3\" caliber. At this point the FINBACK joined the group that strongly believes in the 5\" gun aft. Decided to stay on surface as long as we opened range and firing was not too accurate. The only close shot dropped 75 yards to starboard of forward engine room hatch. This shot did not explode. He continued to fire until range opened to 6,000 yards. As he was in our path to Pomalaa, decided to retire to southeast and patrol southwest of Buton Island the following day. This patrol vessel was only seen head on. At first he appeared to be a small destroyer, but as he only made about 10-11 knots it is believed that he was a PC type patrol boat."
    page: 18
    flags: "Zone typed as '( )'."
