- replaces:
    date: July 30, 1943
    time: '2311'
    page: '3'
    event: fired three torpedo spread at range of 1,800 yards, track of 85° port, depth setting 12 feet, and gyro angle of 355°. Results one hit, one miss, and one premature. From checking times of firing and explosions, it was concluded that the first torpedo hit amidships, the second torpedo prematured at 23 seconds, and the third torpedo seemed to miss astern. The terrific explosion and turbulence produced by the premature may have thrown the third torpedo off its track as it swerved off to the right. All torpedoes were spread to hit the target as our information had checked accurately. Although disconcerting, the premature proved helpful in providing a smoke and water screen of about 100 feet height behind which we turned away. We cleared this screen just in time to observe a torpedo hit amidships. This hit was followed shortly by a flash of flame and an explosion aboard the target distinct from the hit. The target began to fire bow and stern guns of about 5" caliber toward our firing position which we had rapidly left astern. This target was the largest ship this vessel has fired at to date. He was well over 500 feet in length. His silhouette and upper works as seen during the daytime showed him to be similar to the Husimi Maru, 10,800 tons, page 33 of ONI-208-J. After the hit, the pip on the radar seemed to decrease about 1/3 and then stay the same size. We opened range to 7,500 yards and then rounded target to attack again from northward should he fail to sink. Target continued to fire guns to southward for about twenty minutes. Then numerous lights were seen about the decks.
  date: July 30, 1943
  time: '2311'
  zone: H
  tag: attack
  title: Attack 1 on Husimi Maru class freighter
  part: I
  event: fired three torpedo spread at range of 1,800 yards, track of 85° port, depth setting 12 feet, and gyro angle of 355°. Results one hit, one miss, and one premature. From checking times of firing and explosions, it was concluded that the first torpedo hit amidships, the second torpedo prematured at 23 seconds, and the third torpedo seemed to miss astern. The terrific explosion and turbulence produced by the premature may have thrown the third torpedo off its track as it swerved off to the right. All torpedoes were spread to hit the target as our information had checked accurately. Although disconcerting, the premature proved helpful in providing a smoke and water screen of about 100 feet height behind which we turned away. We cleared this screen just in time to observe a torpedo hit amidships. This hit was followed shortly by a flash of flame and an explosion aboard the target distinct from the hit. The target began to fire bow and stern guns of about 5" caliber toward our firing position which we had rapidly left astern. This target was the largest ship this vessel has fired at to date. He was well over 500 feet in length. His silhouette and upper works as seen during the daytime showed him to be similar to the Husimi Maru, 10,800 tons, page 33 of ONI-208-J. After the hit, the pip on the radar seemed to decrease about 1/3 and then stay the same size. We opened range to 7,500 yards and then rounded target to attack again from northward should he fail to sink. Target continued to fire guns to southward for about twenty minutes. Then numerous lights were seen about the decks.
