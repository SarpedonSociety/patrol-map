# USS Finback (SS-230), War Patrol 6
# Fremantle to Pearl Harbor via Midway; Java Sea, Celebes Sea, Ceram Sea and
# Dampier Strait. Under COMSUBSWPAC until 29-31 August.
# Narrative: Gemini in fresh chats, gemini-01.yml (pages 1-9) and gemini-02.yml
# (pages 10-17), saved as given. Tables: contacts-01.md (Gemini, pages 25-27).
# The Summary of Submarine Attacks (pages 28-29) is contacts-02.md: Claude's
# read of the scan, corrected by PSO; Gemini's read of those two pages put values in
# the wrong columns and was not kept. Hand entries here take precedence.
# Page numbers: gemini-01.yml uses the typed narrative page (1-9). gemini-02.yml,
# contacts-01.md and contacts-02.md use the Fold3 / microfilm page (handwritten, 16-29).
# fold3_images below is keyed to match each file, so the two schemes never collide.

boat: SS-230
patrol: 6
year: 1943
report_found: yes
report: "U.S.S. FINBACK - Report of Sixth War Patrol."
comsubpac_report_no: 249
commanding_officer: "J.A. Tyree, Jr."

# No position in the narrative or the tables gives a hemisphere for most of the patrol;
# the Java, Celebes and Ceram Seas lie south of the equator. The Midway leg (aircraft
# contacts 8-14) prints (N) and (W) itself.
default_hemisphere: { lat: S, lon: E }

# Fold3 image numbers from the SOURCE INFORMATION sheets. Keys 1-9: typed
# narrative pages. Keys 16-23: Fold3 pages (narrative typed 10-17). Keys 25-29:
# Fold3 pages (tables and attack summary). The endorsement is image 270500073.
fold3_images:
