- replaces:
    time: '1328'
    page: '19'
    event: surfaced and started in pursuit. The range to the steamer by SJ radar was 9,000 yards. This showed we had been farther off the beach. Closed targets at full speed on the surface. They paid no attention until we opened fired on the steamer at 5,000 yards range. The steamer was light and very high out of the water. Hit steamer about five times. Leading mine planter turned toward us and opened fire with a gun which seemed to be about a one pounder. Directed 4" fire at this ship. He continued to close range in spite of numerous hits until we opened fire with our three 20 mm guns and two 50 caliber machine guns. This barrage combined with a fire breaking out on board, discouraged him and he opened range rapidly. This vessel had settled about three feet. Shifted fire back to the steamer and the second mine planter began closing us. His machine gun fire was falling about 100 yards short. Began to hit him repeatedly with 4" gun. Soon put him on fire from stem to stern. He finally headed for the beach blazing furiously. At this point the first mine planter began to fire at a range of about 8,000 yards. Shifted fire to steamer again and obtained about five more hits. When the mine planter began to straddle us at 6,500 yards, decided the one pounder had gotten larger, and as we had only twenty rounds of 4" left, retired to westward. The mine planters were from 500 1,000 tons. Pictures obtained may provide a better estimate. The one set on fire sank enroute to the beach. The damaged ships headed eastward with power plants apparently intact. Expended 100 rounds of 4" ammunition. As we had been along normal traffic lanes from Ambon to Tioro Strait and Makassar for several days without results, decided to work north of Ceram following day hunting for traffic to Dampier Strait and Babo, New Guinea. Following that, planned to concentrate on Dampier Strait which is reported virgin territory with some traffic.
  date: August 19, 1943.
  time: '1328'
  zone: H
  tag: gun
