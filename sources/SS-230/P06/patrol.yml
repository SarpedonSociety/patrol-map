  28: 270500100
  29: 270500101

# Time zone: the narrative prints a zone letter on nearly every entry: H to
# 20 August, I from 21 August (1615) to 28-31 August, K on 1-2 September, M at
# 0200 on 7 September, Y at Midway and on the passage to Pearl Harbor.
# The attack summary prints times and dates with no zone; they are GCT. Checked
# against the narrative: attacks 1, 3, 4, 5, 6, 7 and 8 equal the narrative time
# minus the zone's offset (H -8, I -9). Attack 2 does not (review.yml).
table_zones: { SUMMARY OF SUBMARINE ATTACKS: Z }

departure:
  port: Fremantle
  date: July 18, 1943
  time: "1400"
  zone: H
  page: 1
  flags: "The narrative entry does not name a port. The prologue says the boat arrived at Fremantle on 26 June and was ready for sea on 18 July. Zone H is printed."

arrival:
  port: Pearl Harbor
  date: September 12, 1943
  page: 23
  standalone: true
  flags: "'September 12, 1943. Arrived Pearl.' No time or zone printed. Gemini had made the arrival the stop at Midway (7 September 1638 Y, moored to USS SPERRY); the boat left Midway 8 September 1500 with TAMBOR."

period:
  start: 1943-07-18
  end: 1943-09-12
  source: "Patrol report"

# The first endorsement (page 1) credits 17,021 tons sunk: 10,800 + 5,471 + 750.
# Its list of damage continues on a page that is not in the PDFs read here, so
# the two damaged ships below are the claims from the attack summary
# (Number damaged or probably sunk). Each ship counted once. Times are local (narrative).
tonnage:
  - { date: 30JUL, time: "2311", zone: H, target: "Passenger-Cargo vessel (HUSIMI MARU class)", result: sunk, tons: 10800, basis: credited, source: "First endorsement, page 1; Attack 1" }
  - { date: 3AUG, time: "2322", zone: H, target: "Freighter (KOYA MARU class)", result: sunk, tons: 5471, basis: credited, source: "First endorsement, page 1; Attack 4" }
  - { date: 19AUG, time: "1328", zone: H, target: "Mine planter", result: sunk, tons: 750, basis: credited, source: "First endorsement, page 1 (marked with an asterisk); gun action, pages 13-14" }
  - { date: 1AUG, time: "0634", zone: H, target: "AK (TAIGEN MARU type)", result: damaged, tons: 5660, basis: claimed, source: "Attack 2, summary page 28" }
  - { date: 11AUG, time: "0021", zone: H, target: "AK (TATUNIYA MARU)", result: damaged, tons: 6344, basis: claimed, source: "Attack 5, summary page 29" }


