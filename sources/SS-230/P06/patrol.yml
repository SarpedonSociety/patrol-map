- replaces:
    date: August 25, 1943.
    time: '0007'
    page: '21'
    event: fired two torpedo spread from bow tubes at 1,430 yards range with 113 starboard track, 020° gyro angle, and depth setting of 12 feet. Results - two misses. Swung ship hard right; just as we were going to fire our stern tubes, noticed backing wash from target's screws. While shifting set up, target turned away giving us a large angle on the bow. Decided not to throw away any torpedoes. The escort apparently did not see us. The target must have seen us just prior to firing or after we started turning. The torpedoes ran normally and our set-up had checked accurately. The torpedo tracks looked good. Unless we were discovered at firing point, at least one torpedo should have hit. Our only mistake was that in trying to keep a small silhouette to both target and escort, a 020° right gyro was accepted. Target and escort headed south as we opened to north. Escort dropped two depth charges aimlessly. Abandoned chase as we could not get ahead of target undetected before he began to hug coast of Ceram. At daylight, he could be in either Kelang or Manipa Strait. This set-up had checked so accurately that we had already credited ourselves with 5,000 tons.
  date: August 25, 1943.
  time: '0007'
  zone: I
  tag: attack
  title: Attack on AK
  part: I
  event: fired two torpedo spread from bow tubes at 1,430 yards range with 113 starboard track, 028° gyro angle, and depth setting of 12 feet. Results - two misses. Swung ship hard right; Just as we were going to fire our stern tubes, noticed backing wash from target's screws. While shifting set up, target turned away giving us a large angle on the bow. Decided not to throw away any torpedoes. The escort apparently did not see us. The target must have seen us just prior to firing or after we started turning. The torpedoes ran normally and our set-up had checked accurately. The torpedo tracks looked good. Unless we were discovered at firing point, at least one torpedo should have hit. Our only mistake was that in trying to keep a small silhouette to both target and escort, a 028° right gyro was accepted. Target and escort headed south as we opened to north. Escort dropped two depth charges aimlessly. Abandoned chase as we could not get ahead of target undetected before he began to hug coast of Ceram. At daylight, he could be in either Kelang or Manipa Strait. This set-up had checked so accurately that we had already credited ourselves with 5,000 tons.
