# Reviewer notes for Finback Patrol 6. Table entries are counted through
# contacts-01.md in order (ship contacts 1-19, aircraft contacts 20-33), then
# contacts-02.md (the attack summary, attacks 1-8 are entries 34-41).
# Delete a note once it's resolved against the report.

rows:
  35: "Attack 2: the summary prints 1434 on 8-1-43 (GCT). The narrative has the attack at 0634 (H) on 1 August, which is 2234 GCT on 31 July; 1434 is 0634 plus 8 hours instead of minus. Attacks 1, 3, 4, 5, 6, 7 and 8 all agree with the narrative once the zone offset is taken off, so this one looks like an error in the report. The map shows Attack 2 twice (the summary row at 1434 on 1 August and the narrative entries at 2234 on 31 July). A discrepancy in the source, not in the transcription."
  41: "Attack 8 (24 August GCT, 0007 I on 25 August local): the summary prints the track as 118° S (PSO checked against the scan). The narrative entry at 0007 I reads '113 starboard track' (Claude zoomed on the narrative scan and read 113). Gyro 028 and spread 3° agree. Recorded, not resolved."
  21: "Aircraft 2: the scan prints (E) after the longitude; Gemini read the hemisphere as blank."
  27: "Aircraft 8 onward (page 27) were out of step with the scan in Gemini's file: dates, longitudes, courses, altitudes and remarks were taken from neighbouring rows. Read again by hand at 280 dpi; see row_fixes in patrol.yml. The last digit of the range in aircraft 14 ('8 Miles') is S-like."

callouts:
  - "Contacts pages 25-26 (ship contacts 1-19) are Gemini's read, not yet checked against the scan, apart from a spot check of contacts 13-16 (position, date and course agree). Page 27 (aircraft) is corrected cell by cell from the scan (row_fixes in patrol.yml); the raw file is as saved."
  - "Attack summary (pages 28-29, contacts-02.md): Gemini's read had values in the wrong columns and was not used. The reading in contacts-02.md is Claude's from the scan, checked and corrected by PSO (three corrections: attack 3 spread 1.6°, attack 5 speed 8.25, attack 8 track 118°). Review note in the vault: Attacks Review - Gemini checked against scans."
  - "Narrative readings still open (neither file settled; see the Narrative Review notes in the vault): 30 Jul 2355 range (8,000 or 3,000); 1 Aug 0634 track angle (87 or 37); 3 Aug 2319 range to escort (2,800 leaning, or 2,000); 21 Jul last entry time (1853 or 1858); 21 Jul 1329 tanker ODINA (Gemini ODI); 30 Jul 2311 ONI page (83 or 33) and pip decrease (15% or 1/3); 3 Aug 2322 T.B.T. or T.D.T.; 11 Aug 0021 TATUNIYA or TATUMIYA; 19 Aug 1328 straddling range (8,500 or 6,500); 7 Sep 1638 fuel received (20,840 or 20,040)."
  - "Corrections applied from the review notes: zone letters Gemini left blank where (H) or (K) is printed; 21 August 1615 (it sits above the 'August 22' heading); the untimed 12 August and 22 August paragraphs Gemini left out or merged; 0634 gyro 0° and 0637 gyro 001° (Gemini 00°); 25 August 0007 gyro 028° (Gemini 020°); 'Celebes,' without Gemini's added 'N.E.I..'."
  - "Page numbers: gemini-01.yml uses the typed narrative page (1-9); gemini-02.yml, contacts-01.md and contacts-02.md use the Fold3 / microfilm page (16-29, handwritten; typed narrative pages 10-17, tables 20-21, attack summary 22-23). fold3_images in patrol.yml is keyed so each file's numbers find the right image. Worth unifying if the convention is settled."
  - "Dates: the second Gemini file left the date blank on every entry after the first of a day, and gave day ranges ('July 22-24', 'August 29-31') as headings. patrol.yml replaces these with a single date (carried from the entry above, or the first day of a range) and adds a flag to each. Range entries are placed on their first day; the report does not say which day."
  - "Endorsement: only the first page was read (COMSUBPAC report no. 249; sunk 10,800 + 5,471 + 750 = 17,021 tons credited). The credited damage on the next endorsement page is not in the PDFs, so the two damaged ships in the tonnage list are the claims from the attack summary (5,660 and 6,344), basis claimed. The mine planter (750) carries an asterisk whose footnote is on the unread page."
  - "Commanding officer J.A. Tyree, Jr. is not on any page read here; it comes from PSO (the signed report). Departure port Fremantle is from the prologue (page 7 of the set), not from the departure entry. Arrival is Pearl Harbor on 12 September (typed 'Arrived Pearl.', no time or zone); the stop at Midway on 7-8 September is an intermediate stop."
  - "Time zones: H to 20 August, I from 21 August 1615, K on 1-2 September, M at 0200 on 7 September, Y at Midway. Nothing in the narrative states the changes; each is printed on the entries themselves."
  - "gemini-02.yml writes 'ca.' in the catalog title with a Cyrillic 'с'; the converter folds it to Latin. The report number (249) is underlined on the endorsement with the 4 overstruck."
