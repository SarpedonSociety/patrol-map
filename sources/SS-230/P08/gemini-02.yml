  tag: "attack"
  title: "Attack #1 & #2 on convoy"
  part: "I"
  charges:
  damage:
  with:
  course:
  speed:
  event: "At with destroyer bearing 005º relative, range 1100 yards, fired three torpedo spread at leading ship of the near column using a 327º gyro angle, 112º(P) track, and 3750 yard range. With destroyer dead ahead, fired a three torpedo spread at three overlapping ships which were next astern using a 350º gyro angle, 90º(P) track, and 3500 yard range. These torpedoes passed under the bow of the destroyer who was frantically signalling and had stopped. Due to the proximity of the escort, his movements were followed more closely than those of the targets after we fired. The following facts were definitely noted: (1) Explosions were seen from the bridge on two targets; (2) Five torpedo explosions were heard topside and below; (3) The soundman reported five torpedo explosions; (4) The times of the explosions checked well with expected torpedo runs; (5) One of the ships in the second target group was stopped and completely covered with greyish smoke similar to ships sunk on other patrols by this ship; (6) Neither of the observed explosions was on the smoking ship; and (7) No depth charges were seen or heard until after the last torpedo explosion. Entering the field of deduction, the torpedo runs indicated a hit on the first ship, a hit on a ship in the far column, two hits on a near ship in the overlapping group of three, and a hit on a ship in the far column. It is believed the ship covered with smoke received two hits and probably sunk. As the radar was kept on the escort during the evasion, no information relative to the targets was obtained."
  page: 8
  flags: "Heading typed as (Attack #1 & #2). Text carries over to page 9."
- date: "April 12."
  time: "2116"
  zone: "K"
  lat:
