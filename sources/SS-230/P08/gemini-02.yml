  from:
  bearing:
  distance:
  bearing_is:
  tag: "attack"
  title: "Attack #3 on escort destroyer"
  part: "I"
  charges: "several depth charges"
  damage:
  with:
  course:
  speed:
  event: "At swung ship 180º, set after tubes on 4 feet, and drew a bead on the destroyer. Intended to let him have a salvo in order to dampen his ardor. He turned toward us blinked a red light and we fired three torpedoes down the throat at 1100 yards. He jogged left and evaded. No hits. Saw the destroyer drop one depth charge. Escorts around the targets dropped several depth charges. The destroyer let us open to 2500 yards before using his gun. He apparently was not sure we were not another escort until we fired at him. The gunfire fell 500 yards wide. Another escort headed in our direction, but dropped behind as we speeded up. At 3400 yards range the destroyer decided it was safe to follow us and he held the range steady. Four main engines would not get us clear. At this point a nearly full moon cleared the clouds and the destroyer became more accurate with his gunfire."
  page: 9
  flags: "Heading typed as (Attact #3)"
