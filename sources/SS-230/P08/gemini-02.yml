  bearing_is:
  tag: "gun"
  title: "Gun action against sampans"
  part: "I"
  charges:
  damage:
  with:
  course:
  speed:
  event: "Surfaced, closed range from 4000 to 2100 yards on last sampan and opened fire. The five leading sampans continued with best speed toward the pass, and the last sampan, in spite of 4\" hits and small arms fire, tried to close range to us to make his machine gun more effective. He forced us to continually turn away to stay out of effective machine gun range. We straddled him continually, but obtained only about ten 4\" hits with 72 rounds. These hits left the target's hull holed, topside demolished, engine exploded, and all personnel killed that didn't jump overboard. The target was left floating. Cleared area before Truk should send a plane after us since other sampans had reached pass in Hall Atoll. As we had closed Nomwin Island to with 2 1/2 miles and not received any gunfire, it is assumed no sizable guns are located there."
  page: 11
