# USS Finback (SS-230), War Patrol 8
# Transcribed by Gemini from JPG page images (not the stitched PDF, whose
# hidden OCR text layer Gemini had been copying), one fresh chat per batch:
# gemini-01.yml (narrative, pages 1-6), gemini-02.yml (narrative, pages 7-12),
# contacts-01.md (ship and aircraft contacts, typed pages 14-18 = microfilm
# 15-19) and attacks-01.md (torpedo attack forms 1-3 and gun attack form 1,
# pages 20-24).
# Pearl Harbor by Midway to the Truk area: lifeguard for the Truk air strikes
# (27 March - 5 April and 9-20 April), searches for downed B-24s, a convoy
# attack north of Truk on 12 April, gun actions at Oroluk (16 April) and off
# Nomwin (19 April); back by Johnston Island to Pearl Harbor.
# The scan has a regular wavy band of faded text (probably a microfilm
# artifact); page 7 times are the worst affected.

boat: SS-230
patrol: 8
year: 1944
report_found: yes
report: "Report of Eighth War Patrol"
