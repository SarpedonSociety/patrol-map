# Patrol metadata — USS Silversides (SS-236), War Patrol 1
# Fill in from the report. Leave a field blank rather than guess;
# the converter flags anything missing.

boat: SS-236
patrol: 1
year: 1942
report: "USS Silversides (SS-236) Report of First War Patrol"
commanding_officer:

# Archival citation, from the Fold3 "SOURCE INFORMATION" sheet that comes
# with each downloaded page. Leave blank what isn't known.
citation:
  archive: NARA
  record_group:          # e.g. 38
  nara_catalog_id:       # e.g. 4697018
  nara_catalog_title:
  reel:                  # e.g. A106
  micro_serial:          # e.g. 42971 (also stamped on the scan)
  file:                  # e.g. A16-3(5)
  serial:                # e.g. 01071
  date:                  # e.g. 9/15/1942
# Fold3 image number for each report page, so entries can link to their page.
# Page number as used in contacts.md -> Fold3 image number.
fold3_images: {}

# Hemisphere applied when a position in the report has no N/S/E/W letter.
default_hemisphere:
  lat: N
  lon: E

# Departure and arrival. Port positions come from data/ports.yml.
departure:
  port: Pearl Harbor
  date: 30APR
  time:
  zone:
  page:
  flags: "Date taken from the first narrative entry (30 Apr). Confirm departure date, time and zone from Part I."

arrival:
  port:
  date:
  time:
  zone:
  page:
  flags: "Not yet transcribed. Add from Part I."

miles_steamed:
fuel_expended:

# Tonnage for the scoreboard, entered by hand. One line per ship.
#   result: sunk or damaged
#   basis:  claimed  (the commanding officer's claim in the report)
#           credited (COMSUBPAC's credit in the endorsement)
#           postwar  (JANAC or later assessment)
#   date/time/zone as typed; without a date the ship counts at the end
#   of the patrol.
tonnage: []

# Narrative positions and events (Part I). Only entries that give a
# position, or record a significant event, belong here.
events:
  - date: 10MAY
    time:
    zone: L
    lat: 33-13-30N
    lon: 151-57-30E
    title: "Burial at sea"
    event: "Burial at sea of Harbin."
    page:
    flags: "Date and time not yet transcribed; placed on 10 May, the day of the gun action. Position is about 1 degree east of the 0805L 10 May trawler position (150-58); check both against the report."
