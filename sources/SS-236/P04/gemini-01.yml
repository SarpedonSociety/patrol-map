    event: "Surfaced at 0150. Sighted a darkened ship ahead at 0305. All hands topside agreed that it was a submarine and as were close to the western boundary of our area, thought probably it was friendly. Decided to work around it to westward. At 0325 when we crossed the moon slick he sighted us and turned toward us. At 0340 he was overhauling us slowly even at 20 knots so decided to try recognition signals in chance he was friendly since we were definitely sighted any way. Our challenge was responded to by a green light flashing 10 followed by characters not in the Morse Code, so at 0357 fired two torpedoes, stern tube slow speed, 1500 Gyro, track angle zero. The first was a premature explosion about 2000 yards astern, it having porpoised during early part of run. The second was not observed. Submerged to avoid depth charge attack as it was realized as the target got closer that he was not a submarine. Three minutes after diving, the first barrage of four depth charges went off astern. The target passed directly over us, let go another barrage ahead with no damage."
