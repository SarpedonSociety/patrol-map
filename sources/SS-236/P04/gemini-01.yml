    event: "He then stopped and listened and when we started up to periscope depth at 0507 with attendant noises of blowing and venting safety, he commenced another run but did not drop. Finally at 0600, got to periscope depth. At 0630 sighted target, a two stack destroyer; commenced approach but his minimum range was 3900 yards as he was covering the area to southward of us. Broke off approach when he went out of sight and resumed course. At 0856 having just finished a periscope sweep, a plane dropped three bombs directly on top of us in rapid succession. Every light in the forward torpedo room and conning tower was knocked out, men thrown out of their bunks and knocked off their feet in the forward torpedo room, several being cut by flying glass, both barometers wrecked. I thought the conning tower was being wrenched loose from the pressure hull. Started deep and found bow planes were jammed on hard dive. The diving officer, Lieutenant R.K.R. WORTHINGTON did a remarkable job in getting to deep submergence in record time and holding the depth. After about 15 minutes, managed to get control of bow planes by hand operation. As was to be expected, the destroyer came over, made two runs at us, dropping four or five charges and finally pulled away to north west. Came up for a look at noon; all clear. Resumed course. Surfaced at 1942. Found that vent gasket on #1 MBT was blown out, bridge loud speakers on 1 MC were wrecked, starboard antenna carried away, shear pins on bow plane rigging shaft in superstructure carried away, prism in #2 periscope cracked. At 2030 radar picked up a plane coming in, so at 2033 when range was 4 miles, made quick dive to avoid; surfaced at 2050 and commenced repairs to topside. At 2325 made landfall on FENI Islands."
