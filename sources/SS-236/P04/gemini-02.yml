    event: "Ran on surface during day. At 1250 sighted smoke which was closed and identified as four freighters. As glassy sea made undetected daylight attack almost out of the question we took station ahead to attack submerged at dusk. After a six hour run we had their zig plan, speed and base course. Submerged at 1818 and commenced approach, keeping to east of convoy to silhouette it in sunset. Two escort vessels sighted one leading, one trailing. Freighters were in two columns of two ships, the leading ship in the western column looked to be about 7000 tons, the others 5000. Later attempts at identification suggested largest ship as similar to SEIWA MARU, 7210 tons gross, page 161, the others similar to ⟦   ⟧, ⟦   ⟧ or BELGIUM MARU, 5500, 5270 and 5822 tons gross respectively. They could have been considerably larger or considerably smaller, however. At a range of about 4000 yards they zigged away; we swung left for a straight bow shot as range was great and could not be determined with accuracy. This put us on the port beam of the leading ships and they were so disposed that the leading ship of the closer column had its bow almost at the stern of the leading ship of the far column and the second ship of the far column had its bow at the stern of the leader of the near column thus presenting three ships, bow to stern; straight bow shot gyro angle 358° on all six shots, track angle 86 port. Fired six torpedoes and at 2-20 and 2-30 heard two hits, probably on near ship, three more hits at 2-40 2-50 3-04 probably two on leading ship of far column and one on other ship in far column. We were then dead ahead of one escort so went deep immediately and rigged for depth charge attack. The sound of ships breaking up was clearly heard for next half hour, also sharp cracks which may have been gun fire. Much scurrying about on part of escorts. Sound tracked them without trouble and heard only one merchant ship screw after attack. All four clearly audible before firing. There was so much noise from the vicinity of attack however that sound reception was not good. The five explosions heard were definitely torpedo hits, both from the sound of their explosions, times from firing checking very closely with estimated torpedo runs, the fact that eight knot freighters would not drop depth charges and had the escort dropped charges they would have been much closer and louder since he was at a range of about 1000 yards when the last torpedo explosion was heard. Depth charging commenced at 2018. A supersonic search commenced; six charges were dropped, last one at 2152 none close. It is fortunate that he wasn't close as we had developed an air leak which was very loud in sound gear and #6 tube outer door was jammed open. Surfaced at 2308. Put a man over side to determine cause of outer door jamming with no results. Left area at full power."
    page: 6
    flags: "Report page 6 ends with freighter comparison list containing illegible/blank ship names before BELGIUM MARU; text continues onto page 7."
