    event: "Proceeded toward position south west of TRUK. During forenoon heard three distant depth charges. At 1701 sighted large enemy submarine on starboard quarter range 5000 yards swung right to 120 port track and fired 3 torpedoes. One premature explosion at one minute ten seconds about 1000 yards off, blocked off view of target. Second explosion one minute fifty seconds after firing. Targets propellers which were distinct and loud until that time, stopped immediately after that. Turned away from firing position and went deep to avoid possible aircraft screen coming up again about five minutes later. Nothing in sight except flock of birds hovering over targets last position. Sound heard nothing after second explosion. No counter measures as would undoubtedly been the case had the submarine survived to get off a contact report. Target had large naval ensign painted on side of conning tower. Two people seen on bridge and one lookout on top of periscope shears, in same position as in photograph at bottom of page 89, ONI 14."
