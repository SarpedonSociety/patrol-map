    event: "At 0103 sighted large tanker. Proceeded to position ahead on his base course 030° T and commenced submerged approach at 0219. Sighted escort, an AM or small DD astern of target. At 0255 fired four stern tubes. 46 seconds after first torpedo fired it hit target in bow completely obscuring bow in column of spray. Second hit heard and felt 15 seconds thereafter but could not be seen because of spray. Third hit, 100 seconds after first torpedo was fired hit target under stack aft. Tremendous explosion and pillar of black smoke 200 high, flame and sparks at its base and out stack. Commenced evasive tactics at deep submergence at 0258. Screws of target stopped immediately and he was not heard again. For the next quarter hour noises were heard thru the hull which sounded like the tanker breaking up. Escort came across stern and let go 8 depth charges. This barrage blew gasket off safety vent as we found later and knocked out 3 depth gauges. It became necessary to put a bubble in safety but with the gasket gone this air blew to the surface. The escort came over with the air bubble as a marker and let go a barrage at 0343 which jarred our teeth. He made another run 10 minutes later but was not as close. He then commenced a supersonic search until after we came up at 0700 to periscope depth. He was about 7000 yards to north of us, angle on bow zero but shortly thereafter he reversed course and pulled out of sight. Another barrage at 0817 when he was out of sight. Retired on southerly course. Sighted a zero plane at 1102 circling our position. He followed us until 1145 when he dropped one heavy depth charge about 4000 yards astern. Upon surfacing that night we found an oil leak in #5 FBT which accounted for the plane. Transferred oil to #3 FBT. A piece of the water compartment bulkhead of one of our own torpedoes was found on deck. The bridge loud speakers were wrecked again and the retaining lug on main induction failed to function so that shortly after starting up on 4 main engines the main induction slammed shut. This tore the air lock doors off in the after battery but the engines were stopped before any casualties resulted. Proceeded on 4 engines toward newly assigned position."
    page: 5
    flags: "Time zone K inferred from Part I note."
