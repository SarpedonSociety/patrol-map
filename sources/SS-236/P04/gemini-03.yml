    event: "After torpedoing the tanker on 18 January the escort let go 12 charges on our impulse bubble. Had we fired bow tubes he may have gotten us with that barrage as they were very close to our stern. The gasket on safety tank was blown and later when it was necessary to blow safety to maintain depth the air escaped thru the vent to the surface. With this as a marker and noise of blowing to assist him he came and let go another barrage. This caused the following damage: 1. Air vent valve on hydraulic line to main induction opened. This caused main induction to slam shut later when on four engines on the surface. 2. Blew out pipe plug on engine cooling water line and stern tube flushing line and broke nipple on air conditioning circulating water pump gauge line. 3. Light bulbs and emergency lights aft broken. 4. Ruptured head flushing water line thru #5 FBT, causing fuel leak to sea. 5. Broke studs off blank flange on #3 FBT which caused fuel leak when fuel was transferred the following day to that tank from #5 FBT. 6. Ruptured both bridge loudspeakers on 1 MC line again. 7. Opened all sea valves and stops thruout the ship and all fuel filling and transfer valves from 1/4 to 2 turns. 8. Loosened pipe plugs on sea valves between valve seat and sea. 9. Collecting tank discharge valve knocked open. 10. Glands on sea valves began leaking. One on compensating line cause a short circuit on #1 main generator terminals causing explosion and fire the following day. 11. All meters, gauges, thermometers out of calibration. 12. Holding down nuts on pilot circuit for main control cubicle jarred loose causing overheating and carbonization two days later. 13. Rivets and nuts on athwartships partitions in officers country sheared. 14. Blew gasket on safety tank vent."
