    damage:      
    course:      "swung right to clear"
    speed:       
    event:       "Went to battle stations and commenced attack at 0030. At 0045 SJ made initial contact at 10000 yards, target on port bow, course north, speed 10.5. This is the first time our radar has picked up a target and functioned properly during the current war. When range had been decreased it was seen that other two ships were escort vessels small DD's, corvettes or mine layers. So decided to concentrate torpedoes on big ship since it must be especially valuable with two escorts. No other ships seen or contacted in SJ sweep. At 0104 fired four torpedoes, ten second interval, no spread, straight bow shot, 80° starboard track and then swung right to clear formation. First hit looked to be a magnetic explosion, ship seemed to jump out of water and streak of flame twice ships length on water line. Second hit under bridge, large column of water and smoke. Third hit heard and felt throughout ship but not observed; we were concentrating on getting clear at that time fourth, missed. One escort vessel went down torpedo track and not finding us they opened with searchlight. Just at this time an explosion occurred on the target, evidentally gasoline as a bright flame shot up 200 feet in air and completely enveloped the ship. Also lit us up like a church. We could even see the camoflouge on the escorts."
