    event: "Went to battle stations and commenced attack at 0030. at 0045 SJ made initial contact at 10000 yards, target on port bow, course north, speed 10.5. This is the first time our radar has picked up a target and functioned properly during the current war. When range had been decreased it was seen that other two ships were escort vessels small DD's, corvettes or mine layers. We decided to concentrate torpedoes on big ship since it must be especially valuable with two escorts. No other ships seen or contacted in SJ sweep."
