    tag: attack
    title: Stern shot at escort during crash dive under fire
    part: I
    charges: 
    damage: 
    course: 
    speed: best speed
    event: "One escort at least opened fire at us and picked us up in the searchlight, range closing rapidly even at our best speed. about a half dozen shells hit around us; ducked at range of 1700 yards at 0118 and fired one stern tube at the trailing escort as we went down. This probably saved our necks as later events indicated that he had to maneuver to avoid and thus lost a golden opportunity. We probably made the all time record from surface to 100 feet but the planes jammed and we set another record for coming up to 35 feet. Finally got control in hand power and went down again."
