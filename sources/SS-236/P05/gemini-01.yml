    tag: attack
    title: Torpedo attack on passenger freighter
    part: I
    charges: 
    damage: 
    course: 
    speed: 
    event: "at 0104 fired four torpedoes, ten second interval, no spread, straight bow shot, 80° starboard track and then swung right to clear formation. First hit looked to be a magnetic explosion, ship seemed to jump out of water and streak of flame twice ships length on water line. Second hit under bridge, large column of water and smoke. Third hit heard and felt throughout ship but not observed; we were concentrating on getting clear at that time fourth, missed. One escort vessel went down torpedo track and not finding us they opened with searchlight. Just at this time an explosion occurred on the target, evidently gasoline as a bright flame shot up 200 feet in air and completely enveloped the ship. Also lit us up like a church. We could even see the camouflage on the escorts."
    page: 6
    flags: "missing zone; typed fined, sgcond, tow shet, swong, larga, Lotting, opa ed, ovidentally, fest, camoflouge"
