    course: "100 T"
    speed:
    event: "Sighted masts through periscope, angle on the bow zero. By 0934 his angle on the bow was still zero, range decreasing rapidly, from bow on appeared to be a destroyer. Ordered stern tubes set at 8 feet. Believed he might be running ahead of a more valuable target I could not see, so c/c to 100 T to open out on track and better identify him. Went to battle stations. Set torpedo depth at 15 feet. By 0940 his angle on bow was 15° port, range 3200 yds, speed checking 18 kts. Still looked like a destroyer or destroyer leader. By 0944 his angle on bow was 30° port, indicating zig to 184 T, apparently not a destroyer, but had a long flat deck between his two masts and single stack amidships. Sea was glassy calm, periscope exposures of necessity brief. Standing by to fire four stern tubes."
    page: 7
