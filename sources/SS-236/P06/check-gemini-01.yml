    event: "With target bearing 048 T, range 11,500 yds, started approach. There were now a few more clouds and it was difficult to see target through binoculars at ranges in excess of 6000 yds. Radar did not pick up escorts until their ranges were about 6000 yds, at which time one escort was located on target port bow, and another on starboard quarter. Decided best shot would be about 125° starboard track and maneuvered for this position. As this ship appeared loaded and was southbound, decided on a full salvo of six, depth setting 18 feet to minimize chances of prematures."
