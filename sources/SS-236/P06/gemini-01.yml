    event: "Could plainly see the tracks of four of the torpedoes. Three of them appeared to run under the target and expected to see some hits as TDC had been checking on during the entire run with radar ranges and TBT bearings. Spread was at least 150 percent of target length. At about this time target started tooting whistle rapidly to attract attention of escorts and fired bursts of 20 MM tracer firing not accurate and appeared to be toward opposite side of target. Shortly afterward the escort astern fired several shots from what sounded like a 3\" gun, but firing was erratic and don't believe we were spotted."
