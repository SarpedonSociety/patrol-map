    tag: "notable"
    title: "Evasion of suspected ASW group"
    part: "I"
    charges:
    damage:
    with:
    course:
    speed:
    event: "Pinging still directly on us, could hear the echo from him. Rigged for silent running and went deep. Negative temperature gradient was indicated at 175 feet, ran at 200 feet, after we were below temperature gradient he apparently lost us, as he started searching with his sound gear. It is strongly suspected that this was an anti-submarine group for the following reasons: (a) Target had much shallower draft than his appearance would indicate. (b) Pinging came from the target, not from the escorts. (c) Puffs of smoke appeared to say 'come on'. (d) If we had been DF'd in our morning transmission he apparently had headed for the spot, instead of avoiding it."
    page: 19
