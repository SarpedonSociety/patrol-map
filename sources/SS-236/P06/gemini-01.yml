    time: "0918"
    zone: "K"
    lat:
    lon:
    from:
    bearing:
    distance:
    bearing_is:
    tag: "attack"
    title: "Periscope approach on possible tender"
    part: "I"
    charges:
    damage:
    with:
    course: "100 T"
    speed:
    event: "Sighted masts through periscope, angle on the bow zero. By 0934 his angle on the bow was still zero, range decreasing rapidly, from bow on appeared to be a destroyer. Ordered stern tubes set at 8 feet. Believed he might be running ahead of a more valuable target I could not see, so c/c to 100 T to open out on track and better identify him. Went to battle stations. Set torpedo depth at 15 feet. By 0940 his angle on bow was 150 port, range 3200 yds, speed checking 18 kts. Still looked like a destroyer or destroyer leader. By 0944 his angle on bow was 100 port, indicating zig to 184 T, apparently not a destroyer, but had a long flat deck between his two masts and single stack amidships. Sea was glassy calm, periscope exposures of necessity brief. Standing by to fire four stern tubes."
    page: 7
    flags: "Time zone K from heading 'All times King (-10)'"
  - date: "August 5, 1943"
    time: "0947-00"
    zone: "K"
    lat:
    lon:
    from:
    bearing:
    distance:
    bearing_is:
    tag: "attack"
    title: "Attack # 2 on TAIGEI class tender"
    part: "I"
    charges:
    damage:
    with:
    course:
    speed:
    event: "0947-00 Fired # 7 tube. 0947-08 Fired # 8 tube. 0947-15 Heard explosion, premature # 7. 0947-22 Fired # 9 tube. 0947-30 Fired # 10 tube. 0947-38 Heard and saw explosion, premature # 9 torpedo. 0948-33 Saw explosion about amidships near the target, but it had appearance of exploding between target and submarine. First impression was that he was throwing a depth charge at us (or toward premature) with a side thrower, but this may well have been a hit with # 10 torpedo. At this time his angle on bow was about 90 P and he took up entire field in periscope in high power. From his appearance later identified him as a submarine tender, TAIGEI class. Sound could only hear one torpedo running, which further indicates # 10 was a possible hit."
    page: 7
    flags: "Time zone K from heading 'All times King (-10)'"
