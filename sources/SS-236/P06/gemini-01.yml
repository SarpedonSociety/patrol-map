    title: "Counterattack by TAIGEI class tender"
    part: "I"
    charges: "5"
    damage: "none"
    with:
    course:
    speed:
    event: "He was swinging rapidly toward us, so 0950 Ordered 300 feet, rigged for depth charge. 0951 First depth charge, passing 180 feet. 0952 Second depth charge. 0952-30 Third depth charge. 0953 Fourth depth charge. 0955 Fifth depth charge. While the charges all sounded heavy, none could be described as \"close\", and all appeared to be on starboard quarter. 0955-1020 Maneuvered to keep screws astern. He would stop occasionally, but appeared to have lost us and did not drop any more. Bathythermograph indicated a layer at 175 feet, which we were well below. He did not echo range. 1020 Soundman heard cracking noises, which he attributed to target breaking up. However considering aggressive actions of target after firing, this is seriously doubted. It is believed that there was a possibility of one hit in the target. Screws were no longer heard."
    page: 8
    flags: "Time zone K from heading 'All times King (-10)'"
