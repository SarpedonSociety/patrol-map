  tag: "gun"
  title: "Gunfire on derelict landing barges"
  part: "I"
  charges: 
  damage: 
  with: 
  course: 
  speed: 
  event: "Slowed down, cruising amongst debris. Escort had apparently rescued survivors. In addition to a large oil slick, there were two standard clinker lifeboats, four landing barges (either swamped or upside down) several small life rafts, numerous life preservers, general wreckage and flotsam. Shot at landing barges with 20 MM, but they were constructed of wood and would not sink. Went along side one landing barge and stripped it of name plate, boat box, anchor, steering wheel, boat hooks etc. Recovered two ring type life preservers which bore the markings TURI MARU KOBE. There were many small kegs floating about, picked one of them thinking it might contain saki but it was full of pickled onions. Picked up a float light of the Franklin variety. Took pictures."
  page: 7
  flags: "Zone L applied from heading"
