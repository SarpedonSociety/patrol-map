  tag: "attack"
  title: "Night surface attack on convoy"
  part: "I"
  charges:
  damage:
  with:
  course:
  speed:
  event: "Trailing escort was not as far astern as he should have been. He was on port quarter, range 2400 yds, angle on bow zero and we were broadside to him. We were not yet in ideal shooting position but decided it was just a question of time before he spotted us so went ahead and shot. Fired all four of the bow tubes at leading ship instead of splitting between first and second ship to give a better spread.\n01-10-12 Fired 1 Tube.\n01-10-20 \" 2 tube.\n01-10-30 \" 3 tube.\n01-10-40 \" 4 tube.\nThen swung with right full rudder to swing the stern toward and steady on the last ship.\n01-13-00 Fired 7 tube.\n01-13-12 Fired ⟦8⟧ tube.\nWent ahead full and started clearing out. Escort spotted us about this time and headed our way.\nExplosions as follows:\n01-15-07 Heavy explosion\n01-15-08 \" \"\n01-15-43 \" \"\n01-15-47 \" \"\n01-16-28 \" \"\n01-18-30 \" \""
  page: "15"
  flags: ""
