  event: "Conducting approach on convoy, when it appeared that we could get in no closer without starboard escort spotting us, ⟦fired three tubes⟧ at leading ship in starboard column which appeared to be largest ship in formation and three at a medium ⟦AK⟧ astern of it. Times of firing were as follows:\n00-43-02 Fired 1\n00-43-16 \" 2\n00-43-26 \" 3\n00-43-50 \" 4\n00-44-00 \" 5\n00-44-09 \" 6\n(Note: TDC had been checking on with TBT bearings and radar ranges and in addition target speed was accurately known. In shifting to second target, radar shifted to escort by mistake and this range was introduced into TDC between fourth and fifth shots. It is believed that this caused us to get one or two hits into an engine aft on far column, as the two hits we aimed at had stacks amidships and later we were to find a crippled engine aft.)"
  page: "12"
  flags: "Portions faint or typed over."
