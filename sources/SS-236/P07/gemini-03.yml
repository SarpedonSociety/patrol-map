  tag: "notable"
  title: "Recovered 20mm gun and instruments"
  part: "I"
  charges:
  damage:
  with:
  course:
  speed:
  event: "⟦KAZAN MARU⟧ sank, stern first. By now could see burning ship was abandoned, so reversed course to investigate debris of ⟦KAZAN⟧ MARU. Fortunately the top of the pilot house floated and on this was mounted a 20mm machine gun. After much work, succeeded in getting it on board, intact with mount, which was very heavy. Also picked up a packing case that was found to contain ⟦several⟧ beautiful new scientific instruments which appeared to ⟦be⟧ ⟦sextants⟧, meteorological instruments. Retrieved what appears to be a coast pilot. Looked for charts but could find none. Picked up the life ring and several other souvenirs."
  page: "14"
