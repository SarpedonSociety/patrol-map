  21: "Attack 4: the form gives 2-05 N 144-39 E (as do attack 3 and gun attack 1). The narrative (24 Oct 1914, page 14) has the ship breaking in two at 2-05 N 146-39 E in both Gemini reads. The cripple lay dead in the water at the attack 3 position; 146-39 is about 120 miles east. Check page 14: if the report has 146, it's a typing error in the report."

callouts:
  - "Narrative dates: gemini-03 fills the date only on the first entry under each day heading. The converter carries the previous entry's date forward and flags it."
  - "Date line, 3-6 November (page 18): clock changes to M (typed '-11 (MIKE)' with an overstrike; M is -12), crossed the 180th meridian at 1700 M, then Y, X ('-11 (Xray)' as read; X is +11) and W. Gemini dates 'Completed battery discharge' 1301 M as 5 November, after the 1700 M crossing; the report's note about a discharge 'completed the preceding day' suggests the repeated day of an eastbound crossing. Check the day headings and zone letters on page 18 and enter them here by hand if they differ."
  - "Landmarks not yet in reference.yml: FENI ISLAND (12 Oct 0330, bearing 224T, 20 miles, the island's bearing from the boat) and MANUS ISLAND (20 Oct 0640, bearing 206 T, no distance). 14 Oct 0330: '⟦MABUA⟧ ISLAND abeam to port distance 13 miles' can't be plotted without the course; the name may be Mahur Island in the Lihir group, where the boat had been patrolling. Check page 3."
  - "23 Oct 2035 and 2142: Gemini reads the station called as 'White Wombat'; earlier entries read the radiotelephone as 'Mike Megat' (gemini-02). Probably a voice call for BALAO; check page 12."
