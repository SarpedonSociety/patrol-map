  18: "Attack 1: target name read by hand as TAI⟦_⟧IN MARU (a faint mark before IN; form_fixes). TAIRIN MARU would fit the gap; check against the postwar credit. Both Gemini reads of the narrative (18 Oct 1130, page 7) give the life rings as 'TURI MARU KOBE'; check page 7. Exploder Mark VI-1A read by hand (Gemini read VI-14)."
