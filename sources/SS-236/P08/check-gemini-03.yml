  event: "ATTACK 9. 257-10 Fired 10 tube. 257-2⟦0⟧ Fired 9 tube. 257-⟦25⟧ Fired 8 tube. 257-35 Fired 7 tube. Torpedoes wore fired with ⟦65⟧ stbd. track, range 1840 yds, gyro 184-187. Target was large tanker and he filled the field of 7 x 50 binoculars. 0300-05 Heard loud explosion. 0300-08 Heard loud explosion. 0300-55 Heard loud explosion. Explosions do not check with torpedo run. Sound heard an explosion which checked about right but time was not recorded. Lt. Nichols on TBT, saw one big splash near bow of target. Commanding Officer was looking for escort. Radar later reported size of target pip decreasing but this could be due to target changing course. About time explosions were heard, target zigged away. Escort again chose wrong side and dashed over to port side of convoy, dropping charges. Weather was probably too rough to shoot and some of the fish ran erratic. It is probable that target was damaged, although evidence is inconclusive."
  page: "-12-"
  flags: "First time typed \"257-10\"; attack entry combines firing through 0300-55; ditto marks used for 0300-08 and 0300-55 explosions"
