  speed:
  event: "ATTACK 2.\n0157-40 Fired 7 tube.\n0157-52 Fired 8 tube.\nThese two torpedoes were fired with a snap set up at a tanker as we were clearing convoy at full speed, estimated range 600 yds, 90 stbd. track. While firing second torpedo, noted target changing course so checked fire. A torpedo hit was heard 2 min 20 sec after firing 7, which indicates a hit on a ship in the port or far column. At time of firing, PPI indicated several ships in line of fire. Rain at the time reduced visibility below 3000 yds. This hit also confused the escorts, as they apparently all headed to the vicinity of the ship that had been hit and depth charged the vicinity for several hours. It is be- lieved that excessive speed, coupled with short range, resulted in torpedoes under running intended target."
  page: 8
  flags: "Report page numbered 8 (typed -7- corrected to 8)."
