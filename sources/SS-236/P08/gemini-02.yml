  event: "ATTACK 7.\n0423-56 Fired 3 tube. Range 1750 yds, target stopped. Estimated 100 stbd. track. Torpedo was seen to pass astern of target.\n0424-55 Fired 2 tube with same data as above except with a 4° offset to the right. Torpedo missed ahead. Swung ship to get in position for a stern shot.\n0435 While backing into position for a close range stern shot, saw target sink rapidly. Radar pip disappeared. We had wasted two torpedoes on this fellow."
