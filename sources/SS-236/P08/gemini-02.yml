  event: "ATTACK 5\n0300-28 Fired 4 tube.\n0302-36 Fired 5 tube.\n0302-47 Fired 6 tube.\nThese were fired at a large freighter, at a range of 1600 yds, 120, port track, and all missed although explosions were heard at 3-08-01 3-08-27 indicating possible hits on something. It was raining at the time so that binoculars could not be used to take TBT bearings, bearings being taken by sighting along vanes on TBT. Range was too close for accurate radar bearings.\nATTACK 5 (Con't)\nTarget could not be seen through grease pencil. Possibly sound bearings would have been more accurate. Commenced another run on same target."
