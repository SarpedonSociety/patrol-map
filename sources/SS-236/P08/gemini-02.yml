  speed:
  event: "ATTACK 8.\n0502-08 Fired 1 tube, 145° stbd. track, range 2050 yds.\n0504-08 Hit square amidships that broke its back. Target was a passenger freighter.\n0512 Saw target sink. Radar pip disappeared. Radar screen was now clear, indicating that there were probably no ships within ten miles. Dawn was rapidly approaching. Secured from battle stations. SILVERSIDES has had herself a busy night of it, firing 19 torpedoes in about three hours. If time had not been pressing, attacks could have been made more deliberately and more hits obtained. Would have \"enjoyed\" this convoy more if had been able to spread the attack over two nights. The Commanding Officer desires to commend -- the officers and crew all did their job well. The control party functioned smoothly. Lt-Comdr. BASLEY, assistant in command and the ass't TDC operator. Lt Worthington quickly analyzed the set-ups on the TDC and set them up accurately. Lt. Kane watched the PPI and supplied accurate ranges and bearings to control party and bridge. Lt. Nichols manned the TBT continuously despite difficult conditions. Lt(jg) Parker plotted continuously from the time contact was first establish- ed. Lt. Cielesz and Lt(jg) Reidel kept things organized below, continuously compensating so that we could dive at any minute and had perfect trim when did make a dive later. Ensign Smiley was busy going from one torpedo room to the other supervising the firing and the reloads which were made in record time. The Commanding Officer, who at the time was too busily engaged watching a nearby escort, did not intentionally allow the ship to get in the dangerous position in the middle of the convoy. Luck and Mr. Fairbanks Morse got us out of that spot."
  page: 9
  flags: "Entry text spans pages 9 and 10."
