  event: "Fired four torpedoes. Range 3300 yds, 125 stbd. track, gyro angle zero, 1 divergent spread. ATTACK 1.\n1432-18 Fired 1 tube.\n1432-27       2 tube.\n1432-35       4 tube.\n1432-44       ⟦3⟧ tube.\n1436-43 Heard faint explosion on sound.\n1437-37 heard loud torpedo explosion.\n1437-53   \"    \"      \"         \"\n1438-17   \"    \"      \"         \"\nAfter firing, went deep, as at least one torpedo was seen smoking badly and patrol boat was seen to turn toward us. Did not see ex- plosions. It is believed all torpedoes hit the reef, probably about 2. mile north of TOAGEL MLUNGUI."
