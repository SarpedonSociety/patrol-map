  event: "ATTACK 6.\n03-55-40 Fired 4 tube.\n03-55-48 Fired 5 tube.\n03-55-57 Fired 6 tube.\n03-57-06 Saw and heard torpedo hit.\n03-57-14  \"   \"    \"      \"     \"\n03-57-22 Heard torpedo hit.\nThese were fired at a large freighter on 80° stbd. track, range 2100 yds, 2 degrees divergent spread. Two hits were seen from bridge and explosions indicate a third hit probably not seen due to target being obscured in smoke. Saw numerous flashlights on target which was later realized to be crew abandoning ship. Target slowed down and tracked at zero speed, and as much oil in the water but did not appear to be sinking fast, decided to fire a coup de grace shot at it."
  page: 9
