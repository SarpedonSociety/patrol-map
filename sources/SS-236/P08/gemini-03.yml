  event: "Restored power on stbd. shaft. During the afternoon checked over the control cubicle carefully. Only damage was burnt cork on overhead. Control cubicle operated normally in all positions. Believe cork became overheated while operating at full power, and then when ventilation was secured upon diving its temperature reached the ignition point, and it burst into flame. The cork is very close to the bus bars and starting resistors. Some insulation with a higher ignition temperature is indicated."
