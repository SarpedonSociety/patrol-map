  event: "ATTACK # 9.\n0257-10 Fired # 10 tube.\n0257-20 Fired # 9 tube.\n0257-20 Fired # 8 tube.\n0257-35 Fired # 7 tube.\nTorpedoes were fired with a 65 stbd. track, range 1840 yds, gyro 184-187. Target was large tanker and he filled the field of 7 x 50 binoculars.\n0300-05 Heard loud explosion.\n0300-08 \" \" \"\n0300-55 \" \" \"\nExplosions do not check with torpedo run. Sound heard an explosion which checked about right but time was not recorded. Lt. Nichols on TBT, saw one big splash near bow of target. Commanding Officer was looking for escort. Radar later reported size of target pip decreasing but this could be due to target changing course. About time explosions were heard, target zigged away. Escort again chose wrong side and dashed over to port side of convoy, dropping charges. Weather was probably too rough to shoot and some of the fish ran erratic. It is probable that target was damaged, although evidence is inconclusive."
  page: "-12-"
  flags: "Third torpedo fire time typed as 0257-20, identical to second; charges dropped by escort are mentioned in narrative text."
