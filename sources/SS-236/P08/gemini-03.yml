  event: "O.O.D. Lt. Malone, sighted impulse bubble and torpedo wake bearing 160 T, range of bubble about 1200 yds. Torpedo coming in on abot a 120 stbd. track OOD swung left with full rudder and went ahead emergency. Torpedo passed about 50 yds down stbd. beam. Another torpedo was seen to the right of this one, passing about 150 yds. down stbd. beam. Last torpedo fired came down port side, distance about 75 yards. Lt. Malone deserves much credit for his prompt and correct action. After firing, could see periscope astern. The Jap deserves credit for his periscope handling. Sea was calm, with some ripples and no whitecaps. SILVERSIDES had been zigzagging, keeping an all-around lookout with both periscopes plus 4 lookouts and 2 officers on the bridge. A possible sound approach is indicated. SHIP CONTACT # 16."
  page: "-11-"
  flags: ""
