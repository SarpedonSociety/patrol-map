- replaces:
    date: January 2, 1944.
    time: '1359'
  date: January 2, 1944.
  time: '1359'
  tag: notable
  title: Surfaced due to maneuvering room fire
  part: I
  event: Surfaced. Flame about under control, but maneuvering room untenable except with rescue breathing apparatus. 1⟦ ⟧ CO2 fire extinguishers had been used on fire. Crew fighting fire becoming nauseated and in several cases almost collapsed. Continued submergence deemed unwise.
  page: -11-
  flags: 'Second digit of the extinguisher count unreadable on the scan (PSO: ''1_''); Gemini''s first read had 14, the rerun 17. Page -11-.'
- replaces:
    date: January 4, 1944.
    time: '1125'
  date: January 4, 1944.
  time: '1125'
  part: I
  event: 'SHIP CONTACT # 17. SJ radar indicated two pips bearing 310 T, distance 31,65⟦ ⟧ yds. Could see nothing, started tracking. Tracked on easterly course, speed about 1⟦ ⟧ kts. Closed in to take a look through high periscope and could see masts of two large ships. Maneuvered to get in position ahead and checked zig plan. Weather too rough to run at periscope depth and too rough for firing torpedoes. Decided to make night surface attack, hoping seas would moderate. After sunset closed to 15,000 yds, at this range the escort pip showed up.'
  page: -12-
  flags: 'Read from the scan by the PSO and Claude: the last digit of the range is missing (31,65_; the attack 9 form gives 31,650 yds) and the second digit of the speed is unreadable. Page -12-. Gemini gave this entry as a summary.'
- replaces:
    date: January 5, 1944.
    time: '0155'
  date: January 5, 1944.
  time: '0155'
  part: I
  event: Went to battle stations and commenced approach. Night was fairly dark, partially overcast, seas had abated somewhat but it was still very rough. Set torpedoes at 15 feet, planning to fire while beam to sea.
  page: -12-
  flags: 'Read from the scan: ''while beam to sea'' (the rerun read ''beam to stern''). Page -12-.'
- replaces:
    date: January 5, 1944.
    time: 0228
  date: January 5, 1944.
  time: '0226'
  part: I
  event: Sighted target at about 80⟦ ⟧ yds, swung to put stern to him and endeavored to keep his angle on the bow small. PPI indicates targets in line of bearing, escort between and astern. Selected starboard tanker and planned to fire on 60 or 70 stbd. track with the stern tubes (the only torpedoes left). Zig plan and speed was known accurately due to continuous radar plot for about 14 hours.
  page: -12-
  flags: Time read 0226 from the scan (the rerun had 0228, the first read 0226); range 80_ yds with the last digit lost (the first read had 800, the rerun 8000). Page -12-. Words 'swung' and 'angle' partly lost; check.
