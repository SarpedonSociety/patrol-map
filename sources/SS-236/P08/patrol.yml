# USS Silversides (SS-236), War Patrol 8
# Narrative: gemini-01.yml (pages 1-5), gemini-02.yml (pages 6-10) and gemini-03.yml (pages 11-15), the
# last a second Gemini read from the narrative pages and the NARA source pages together. check-gemini-03.yml
# is the first, poorly read version of those pages, kept for comparison; the converter ignores it.
# Page numbers: the typed number at the foot of each page (-11-). The microfilm number written in the
# corner is the typed number plus one.
# Pages 1-10 of the narrative have not been checked against the scan yet. Pages 11-15 were checked by the PSO
# and Claude (see the hand entries below). Tables (contacts-01.md, contacts-02.md) and the attack forms
# (attacks-01.md) are Claude's reading of the scans; the Gemini reads are in check-contacts-01.md and
# check-attacks-01.md.
# Pearl Harbor to Midway, Palau area (Area 10). Three ships sunk (attacks 4, 6, 8) in the convoy attack of
# 29 December. Index figures from the PSO's INDEX SS.236.8: 18,500 tons sunk, 8,000 tons damaged.

boat: SS-236
patrol: 8
year: 1943
report_found: yes
report: "U.S.S. SILVERSIDES Report of Eighth War Patrol."
comsubpac_report_no: 351
commanding_officer: "J.S. COYE, Jr."
table_zones: { "SHIP CONTACTS": I, "AIRCRAFT CONTACTS": I }

departure:
  port: Pearl Harbor
  date: December 4, 1943
  time: "1405"
  zone: VW
  page: 1
  flags: "Narrative: 'Departed Submarine Base, Pearl Harbor'; time typed 1405 VW."

arrival:
  port: Midway
  date: January 15, 1944
  time: "1500"
  zone: Y
  page: 15

period:
  start: 1943-12-04
  end: 1944-01-15
  source: "Patrol report"

# Fold3 images by typed page (typed page n is Fold3 page n+1 of the download).
fold3_images: { 1: 270957894, 2: 270957899, 3: 270957904, 4: 270957910, 5: 270957914, 6: 270957918, 7: 270957924, 8: 270957928, 9: 270957933, 10: 270957936, 11: 270957941, 12: 270957948, 13: 270957953, 14: 270957957, 15: 270957961 }

# Claimed tonnage from the TORPEDO ATTACK DATA forms (attacks-01.md). Times are the boat's own, zone I (-9).
tonnage:
  - { date: "Dec. 29, 1943", time: "0246", zone: I, target: Tanker (type unclear), result: sunk, tons: 7000, basis: claimed, source: "Attack 4, page 21" }
  - { date: "Dec. 29, 1943", time: "0356", zone: I, target: Freighter, result: sunk, tons: 5500, basis: claimed, source: "Attack 6, page 23 (average tonnage of the class)" }
  - { date: "Dec. 29, 1943", time: "0503", zone: I, target: Passenger-freighter, result: sunk, tons: 6000, basis: claimed, source: "Attack 8, page 25" }

form_fixes:
  - { attack: 9, old: "Long. 135-08", new: "Long. 135-08 E" }
  - { attack: 9, old: "J⟦a⟧n. 5, 1944", new: "Jan. 5, 1944" }

# Torpedo attack results for the map marker (README, "Attack results"). hit = at least one torpedo exploded
# against the target aimed at; miss = none. Keys are the ids on the detail cards.
results:
  A43: miss   # attack 1, 26 Dec: three torpedoes exploded against the reef, one dud; "Ships sunk/damaged None"
  A44: miss   # attack 2: one hit, but "not on target fired at" (a ship in the far column was possibly damaged)
  A45: miss   # attack 3: "One probably hit - not on target fired at"
  A46: hit    # attack 4: three hits, tanker sunk
  A47: miss   # attack 5: "Possibly two hits - not on target aimed at"; ships sunk None
  A48: hit    # attack 6: three hits, freighter sunk
  A49: miss   # attack 7: both missed (the target sank from attack 6's hits)
  A50: hit    # attack 8: hit amidships, passenger-freighter sunk
  # A51: attack 9, 5 Jan: "Hit or miss: See remarks"; "evidence is inconclusive", target "probably damaged". Not entered.

