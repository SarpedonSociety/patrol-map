  page: -11-
  flags: 'Dated 30 December by the PSO: the page opens with the entries for 0700, 0920 and 2110 before the ''December 31, 1943.'' heading, and the aircraft contact table puts contacts 6 and 7 on 30 December. Page -11- (microfilm 12), read from the scan.'
