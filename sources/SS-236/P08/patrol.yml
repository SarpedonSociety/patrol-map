- replaces:
    date: December 29, 1943
    time: 03-55-40
  date: December 29, 1943
  time: 0355-40
  tag: attack
  title: Attack 6
  part: I
  event: 'ATTACK 6.

    03-55-40 Fired 4 tube.

    03-55-48 Fired 5 tube.

    03-55-57 Fired 6 tube.

    03-57-06 Saw and heard torpedo hit.

    03-57-14  "   "    "      "     "

    03-57-22 Heard torpedo hit.

    These were fired at a large freighter on 80° stbd. track, range 2100 yds, 2 degrees divergent spread. Two hits were seen from bridge and explosions indicate a third hit probably not seen due to target being obscured in smoke. Saw numerous flashlights on target which was later realized to be crew abandoning ship. Target slowed down and tracked at zero speed, and as much oil in the water but did not appear to be sinking fast, decided to fire a coup de grace shot at it.'
  page: '9'
  flags: Time typed 03-55-40 as in the report; written 0355-40 so the converter reads it. Attack 6, page 9.
