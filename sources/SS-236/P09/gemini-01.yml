  zone: "I"
  event: "PC speeded up, heading on course 170 T."
  page: "14"
- date: "17 March"
  time: "0642"
  zone: "I"
  event: "Lost sound contact with PC. Decided not to chase convoy as air escort would probably effectively prevent further end around runs and fuel expenditure was becoming high. Headed back toward assigned area, 10 NW."
  page: "14"
- date: "17 March"
  time: "0820"
  zone: "I"
  event: "JP heard high speed screws bearing 072 T., but could see nothing."
  page: "14"
- date: "17 March"
