  page: "9"
  flags: "No time typed."
- date: "13 March"
  time: "1504"
  zone: "I"
  event: "Sighted possible torpedo wakes. Evaded. No periscopes sighted. Wakes could have been windstreaks."
  page: "9"
- date: "14 March"
  time: "0426"
  zone: "I"
  event: "Sighted group of lights on BABELTHUAP IS. Lights estimated to be in Lat. 7-22N., Long. 134-34E."
  page: "9"
  flags: "7-22 N 134-34 E is the position of the lights ashore, not the boat; not plotted."
- date: "14 March"
  time: "0457"
  zone: "I"
  event: "Dove for submerged patrol off MALAKAL PASS."
  page: "9"
- date: "14 March"
  time: "0645"
  zone: "I"
  event: "Passed close to a sampan which was probably a fishing boat."
  page: "9"
  flags: "Time read 0645 (Qwen) / 0615 (Bonsai)."
- date: "14 March"
  time: "0740"
  zone: "I"
  event: "Sighted patrol boat. In sight most of the day. Another was seen later on. They appear to patrol about a mile off the reef parallel to it, off MALAKAL PASS and GORAKBLAD PASSAGE. They were not echo ranging."
  page: "9"
- date: "14 March"
  time: "0836"
  zone: "I"
  event: "Sighted \"DAVE\" over MALAKAL HARBOR. One or more \"DAVE\" planes were in sight most of the day. AIRCRAFT CONTACT #17."
  page: "9"
  flags: "The aircraft table has this contact at 0838."
- date: "14 March"
  time: "0901"
  zone: "I"
  event: "Sighted masts, later identified as a large 9-10,000 ton tanker, anchored behind reef in Lat. 7-18 N., Long. 134-33 E. Probably de fueling. SHIP CONTACT #11."
  page: "9"
  flags: "7-18 N 134-33 E is the tanker's anchorage, not the boat; not plotted here (ship contact 11 carries it)."
- date: "14 March"
  time: "1251"
  zone: "I"
  event: "Sighted \"MAVIS\" and \"BETTY\". AIRCRAFT CONTACTS #18 and #19."
  page: "9"
- date: "14 March"
  time: "1323"
  zone: "I"
  event: "Sighted flight of 12 \"ZEKES\" in formation. Air activity in PALAU area has shown a marked increase since last patrol. AIRCRAFT CONTACT #20."
  page: "9"
  flags: "Type read ZERES (Qwen) / ZEBES (Bonsai); the aircraft table types ZEKE."
- date: "14 March"
  time: "1921"
  zone: "I"
  event: "Surfaced. During night patrolled to east and southeast of PALAU. Sighted red lights on radio towers indicating night flying was in progress."
  page: "9"
- date: "15 March"
  time: "0453"
  zone: "I"
  from: "GORAKBLAD PASSAGE"
  bearing: "275 T"
  distance: "10 miles"
  bearing_is: "to_landmark"
  event: "Dove for submerged patrol with GORAKBLAD PASSAGE bearing 275 T., distance 10 miles. Sighted 3 sampans fishing, and later sighted the two patrol boats, which were in sight most of the day. Tanker, ship contact #11, was still at anchor, but bow appeared higher indicating he is about half de-fueled. During day sighted two \"MAVIS\" planes, a flight of five \"BETTY\" planes, and several \"DAVES\". AIRCRAFT CONTACT #21."
  page: "10"
- date: "15 March"
  time: "1235"
  zone: "I"
  event: "Heard echo-ranging and sighted smoke in direction of MALAKAL PASS. Commenced approach. SHIP CONTACT #12."
  page: "10"
- date: "15 March"
  time: "1320"
  zone: "I"
  event: "Leading escort, a CHIDORI, apparently picked us up on his sound gear. Sound conditions unusually good. Convoy zigged away, and port quarter escort, a PC, came over toward us and lay to several hundred yards away, apparently listening. Remained at periscope depth and watched him, as there were several white caps. Saw him signalling to leading escort and finally he resumed his place in the convoy. PC did not echo range, and they apparently only had a doubtful contact. Convoy consisted of 3AK, 1 CHIDORI and 3 PC plus usual air coverage. Convoy was in line of bearing with largest AK in center (a 4500 ton engine aft AK), with two 3000 ton AK in wing positions. Could not obtain favorable firing position. Convoy appeared to be heading toward RABAUL or WEWAK. Trailed at six knots submerged."
  page: "10"
- date: "15 March"
  time: "1738"
  zone: "I"
  event: "Convoy bore 148 T., estimated range 13,000 yards."
  page: "10"
- date: "15 March"
  time: "1848"
  zone: "I"
  event: "Surfaced with a low battery and started pursuit."
  page: "10"
- date: "15 March"
  time: "2008"
  zone: "I"
  event: "Made radar contact bearing 123 T., distance 14,000 yards. Commenced end around run."
  page: "10"
- date: "15 March"
  time: "2030"
  zone: "I"
  event: "Searchlight on BABELTHUAP made a brief sweep in our direction."
  page: "10"
- date: "15 March"
  time: "2145"
  zone: "I"
  event: "Went to Battle Stations. Attempted to attain position for night surface attack, but moon started rising before we could reach firing position. Shifted to other bow of target to avoid being silhouetted."
  page: "10"
- date: "15 March"
  time: "2317"
  zone: "I"
  event: "Dove to radar depth to make submerged approach at radar depth, Range to target 9,770 yards on bearing 337 T."
  page: "11"
- date: "15 March"
  time: "2329"
  zone: "I"
  event: "Range to leading escort 3,450 yards, on bearing 351 T."
  page: "11"
- date: "15 March"
  time: "2330"
  zone: "I"
  tag: "counterattack"
  charges: "5"
  event: "Escort speeded up and dropped a pattern of five depth charges. He had either sighted us or picked us up by radar. Went deep."
  page: "11"
- date: "15 March"
  time: "2352"
  zone: "I"
  tag: "counterattack"
  charges: "1"
  event: "Depth charge."
  page: "11"
- date: "16 March"
  time: "0008"
  zone: "I"
  event: "Screws sounded weak, started up to periscope depth."
  page: "11"
- date: "16 March"
  time: "0022"
  zone: "I"
  tag: "counterattack"
  charges: "1"
  event: "Depth charge."
  page: "11"
- date: "16 March"
  time: "0130"
  zone: "I"
  event: "Surfaced and pursued."
  page: "11"
- date: "16 March"
  time: "0210"
  zone: "I"
  event: "Sighted trailing escort, worked around him."
  page: "11"
- date: "16 March"
  time: "0233"
  zone: "I"
  event: "Made radar contact with convoy and commenced end around run."
  page: "11"
- date: "16 March"
  time: "0428"
  zone: "I"
  event: "Dove 7800 yards ahead of convoy."
  page: "11"
- date: "16 March"
  time: "0448"
  zone: "I"
  event: "Made tubes ready. Boat began to get light and broached to 37 feet. Flooded in rapidly and got down to periscope depth but could not hold at 2/3 speed. Heard an escort speed up and appeared to be coming in on constant true bearing, but could not see due to periscope being under."
  page: "11"
  flags: "'got down' (Qwen); Bonsai read 'got thrown'."
- date: "16 March"
  time: "0458"
  zone: "I"
  event: "Screws close, same bearing, went deep. Escort passed overhead but did not drop."
  page: "11"
- date: "16 March"
  time: "0547"
  zone: "I"
  event: "Periscope depth, convoy in sight."
  page: "11"
- date: "16 March"
  time: "0642"
  zone: "I"
  event: "Surfaced and commenced end around run, keeping smoke in sight."
  page: "11"
- date: "16 March"
  time: "0938"
  zone: "I"
  event: "Dove upon sighting a \"BETTY\" bearing 265 T., distance 9 miles on a parallel course. AIRCRAFT CONTACT #22."
  page: "11"
- date: "16 March"
  time: "1006"
  zone: "I"
  event: "Surfaced and resumed end around run."
  page: "11"
- date: "16 March"
  time: "1358"
  zone: "I"
  event: "Dove upon sighting two \"DAVE\" planes, distance 6 miles, who were apparently air escort for convoy and searching ahead on convoy track. AIRCRAFT CONTACT #23. Commenced high speed approach as we were not yet on convoy track and air escort would prevent further daylight surface running."
  page: "12"
- date: "16 March"
  time: "1621-55"
  zone: "I"
  tag: "attack"
  title: "Attack 1"
  event: "ATTACK #1. Came in on port bow of target. Convoy was in line of bearing with CHIDORI about 1500 yards ahead of leading ship. One PC was seen abeam of ship on port side and an other on port quarter. Planned to fire three at ship on port side and three at largest ship in the center. Everything was going according to plan until convoy made an unexpected zig toward which placed port ship inside 500 yards. Let him pass ahead at about 200 yards and at 1621-55 Fired #1 tube at center ship, aimed at MOT. 1622-11 Fired #2 tube at center ship, aimed at bow. 1622-23 Fired #3 tube at center ship, aimed at stern."
  page: "12"
- date: "16 March"
  time: "1622-26"
  zone: "I"
  event: "Saw and heard torpedo hit under forward mast. Started to get a set-up on the port ship but gyro angle was too large. Started deep as the port beam PC was about 500 yards away, and one of the torpedoes was seen to have left a trail of blue smoke."
  page: "12"
- date: "16 March"
  time: "1622-57"
  zone: "I"
  event: "Heard torpedo hit. This was the third torpedo, the second torpedo probably missed ahead."
  page: "12"
- date: "16 March"
  time: "1623-32"
  zone: "I"
  tag: "counterattack"
  charges: "5"
  event: "Five depth charges. Not too close, but closest experienced in the last four patrols."
  page: "12"
- date: "16 March"
  time: "1637"
  zone: "I"
  tag: "counterattack"
  charges: "2"
  event: "Two depth charges. Loud breaking up noises were heard throughout the ship. It is believed to have sunk within ten minutes."
  page: "12"
- date: "16 March"
  time: "1730"
  zone: "I"
  event: "Screws were faint, could hear only echo ranging, started up. However, as soon as we got through about a 3 degree layer, screws speeded up and pinging became localized in our direction. Ducked under layer again."
  page: "12"
  flags: "'Ducked' read 'Duck[?]' (Qwen) / 'Duckded' (Bonsai)."
- date: "16 March"
  time: "1821"
  zone: "I"
  event: "At periscope depth. One PC in sight in vicinity of attack, possibly searching for survivors."
  page: "13"
- date: "16 March"
  time: "1917"
  zone: "I"
  event: "Surfaced and resumed pursuit."
  page: "13"
- date: "16 March"
  time: "2102"
  zone: "I"
  event: "Made radar contact on PC bearing 190 T., distance 5050 yards. Worked around him."
  page: "13"
  flags: "'PC' read P3 (Qwen) / PJ (Bonsai)."
- date: "16 March"
  time: "2229"
  zone: "I"
  event: "Made radar contact on convoy bearing 197 T., distance 16,200 yards. Closed to 10,000 yards and definitely established that there was only two ships in convoy, whereas previous to attack there had been three. Commenced end-around run."
  page: "13"
- date: "17 March"
  time: "0115"
  zone: "I"
  event: "Sent message to Comsubpac reporting contact with convoy. During evening had received word to enter area 10 NW. Believe this message did not get through, although it was receipted for by NPG."
  page: "13"
  flags: "Station read NPG (Qwen) / MPG (Bonsai). The typed line has a gap after 'reporting'."
- date: "17 March"
  time: "0318"
  zone: "I"
  event: "Dove to conduct approach. Ahead of convoy, range to ship 14,000. Range to leading escort 12,000. Decided to conduct entire approach at periscope depth, as moonlight was fairly bright, and believe last night escorts picked up our shears by radar."
  page: "13"
- date: "17 March"
  time: "0422"
  zone: "I"
  event: "When about 1500 yards on starboard bow of leading escort, he suddenly turned towards and speeded up. He had been pinging during entire approach but gave no indication that he picked us up by the usual method of shifting to hand keying or shifting to short scale. Entire approach had been at periscope depth, using periscope sparingly when inside 3,000 yards."
  page: "13"
- date: "17 March"
  time: "0424"
  zone: "I"
  event: "Started deep when there was no longer any doubt as to his intentions."
  page: "13"
- date: "17 March"
  time: "0425"
  zone: "I"
  tag: "counterattack"
  charges: "4"
  event: "0425-0427 Four depth charges about 30 seconds apart. Escort passed directly overhead but fortunately had started dropping too soon."
  page: "13"
  flags: "Typed with the time span 0425-0427; placed at 0425."
- date: "17 March"
  time: "0527"
  zone: "I"
  tag: "counterattack"
  charges: "1"
  event: "Depth charge."
  page: "13"
- date: "17 March"
  time: "0553"
  zone: "I"
  event: "At periscope depth, sighted PC bearing 140, distance about 3,000 yards, apparently lying to, listening."
  page: "13"
- date: "17 March"
