Narrative (Part B), typed pages 1-21a of the report (scan files p2-p23 of the OCR note). Not raw Gemini output.
Claude put the OCR working transcription into the narrative YAML the converter reads, one event per typed entry.
- Where the two reads agree, Qwen's text is used.
- Where they differ in a number, the PSO's hand reading from the scan is used, and the entry is flagged.
- Where they differ only in garbled characters ('surfæ e', 'ISTA NDS', 'Surfacd'), the reading that forms the
  word is used. The typeface's M often reads as N ('NAVIS', 'NANOKARI', 'NILE BAY'): MAVIS, MANOKWARI and MILNE
  are used, as the aircraft table and the endorsement type them.
- Bonsai lost the top of typed pages 6-8 (p7-p9); there the text is Qwen's alone.
- Qwen lost the top of typed page 3 (p4). The PSO confirmed from the scan that nothing is typed between the page
  heading and the 0700 (K) entry.
Positions are entered only where the report gives one for the boat. Positions of targets or lights, and the centres
of search areas, are given in the flags.
Times are as typed: VW, Y, M, L, then K from 28 February. At 2300 (K) on 7 March: 'Set clocks back one hour to -9,
(I), time zone. All times in narrative from now on will be -9 unless otherwise described.' The entries from 8 March
to 1 April carry no letter and are given zone I. At 2100 on 1 April: 'Set clocks ahead one hour to -10 time'; the
entries from 2 April are typed (K).
Page numbers are the typed numbers ('- 1 -' to '- 21a -'). The handwritten number on each scan is the typed number
plus one; after page 21a, plus two.

