  event: "Transmitted serial five to Comsubpac info CTF 72 reporting that would shift to Bellconnen schedule at 1500 GCT 18 March 1944."
  page: "14"
  flags: "'at' read 'nf' (Qwen) / 'at' (Bonsai)."
