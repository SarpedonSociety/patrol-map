  zone: "I"
  event: "ATTACK #2. Ship bore 126 T., distance 4200 yards. Appeared to be an engine aft freighter or oiler, estimated tonnage 3000, ⟦MFM⟧ with maierform bow and cruiser stern, diesel propelled. An escort was astern, and was seen to be in tow. Escort was of converted trawler type and camouflaged with trees lashed to its mast. During last twenty minutes of approach, target steadied on course to enter harbor."
  page: "18"
