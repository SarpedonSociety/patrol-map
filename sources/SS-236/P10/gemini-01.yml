  zone: "K"
  part: "I"
  event: "Entered new area in accordance with PENTATHLON schedule."
  page: "9"
- date: "May 13, 1944"
  time: "0128"
  zone: "K"
  part: "I"
  event: "Lookout reported a light bearing 315 T. Went ahead full speed on four engines on course 315."
  page: "9"
- date: "May 13, 1944"
  time: "0210"
  zone: "K"
  part: "I"
  event: "Nothing further sighted, slowed down and resumed course."
  page: "9"
- date: "May 13, 1944"
  time: "0500"
  zone: "K"
  part: "I"
  event: "Dove between ANATAHAN and SAIPAN IS. During morning sighted many planes, mostly \"RUFES\"."
  page: "9"
- date: "May 13, 1944"
  time: "1140"
  zone: "K"
  part: "I"
  event: "Heard echo ranging, commenced approach."
  page: "9"
- date: "May 13, 1944"
  time: "1200"
  zone: "K"
  part: "I"
  event: "Identified as same pair of A/S vessels we had seen yesterday. Broke off approach. They were still wandering around area, and an unexpected reversal of course was almost embarrassing. Believe this is possibly the Q ship that SUNFISH reported. Same as S/C #5."
  page: "9"
- date: "May 13, 1944"
  time: "2008"
  zone: "K"
  from: "ANATAHAN IS."
  bearing: "S"
  distance: "27 miles"
  part: "I"
  event: "Surfaced about 27 miles south of ANATAHAN IS."
  page: "10"
- date: "May 13, 1944"
  time: "2235"
  zone: "K"
  part: "I"
  event: "Sighted possible exhaust of plane, cut in SD for 5 seconds, all clear."
  page: "10"
- date: "May 14, 1944"
  time: "0020"
  zone: "K"
  part: "I"
  event: "Began second attempt to convert #4 ballast tank."
  page: "10"
- date: "May 14, 1944"
  time: "0218"
  zone: "K"
  part: "I"
  event: "Sighted twin exhausts of aircraft. SJ picked it up at 8 miles. S/C #7. He appeared to be circling to get down moon and then started in. Got men out of superstructure, and at"
  page: "10"
  flags: "The report labels this aircraft S/C #7; the aircraft table lists it as aircraft contact 7. Kept as typed."
- date: "May 14, 1944"
  time: "0220"
  zone: "K"
  part: "I"
  event: "Dove, or rather attempted to dive. Hydraulic pump motor would not start. Made hand dive. Boat hung up at 30' several minutes when #2 vent closed after being opened by hand but still indicated open on board. Finally got under; no bombs. This impressed us forcibly with the necessity of practicing hand dives, which up to now we had not done."
  page: "10"
- date: "May 14, 1944"
  time: "0317"
  zone: "K"
  part: "I"
  event: "Surfaced. Conning tower hatch would not open. Went out through conning tower door and located trouble with hatch - one of the blank flanges from #4 vent had wedged itself on top of hatch. In our haste of diving had not been able to get all conversion gear below."
  page: "10"
- date: "May 14, 1944"
  time: "0355"
  zone: "K"
  part: "I"
  event: "[SUMMARY] Sighted red and green lights of a plane coming in on bearing 060 T. and dove; the SD picked up strong radar interference, and the JP operator reported hearing the plane pass overhead. Remained submerged. 'These night planes keep a patrol from becoming monotonous, but are a very potential hazard unless we get a suitable detector.' During the day sighted quite a few planes, but no ships."
  page: "10"
- date: "May 14, 1944"
  time: "2002"
  zone: "K"
  part: "I"
  event: "Surfaced. During the evening completed converting #4 into a ballast tank. Made short dive to flush it out."
  page: "10"
- date: "May 14, 1944"
  time: "2305"
  zone: "K"
  part: "I"
  event: "Had interference of another SJ radar in vicinity bearing 290 T., probably USS TUNNY."
  page: "10"
- date: "May 15, 1944"
  time: "0504"
  zone: "K"
  part: "I"
  event: "Dove north of SAIPAN, in southernmost position of area. During approach to diving spot, kept at least 25 miles from islands, presented small silhouette when possible, and flooded down. Do not believe we were picked up by radar, as our patrol boat did not show up. All that was sighted in the morning were a few planes and one sampan."
  page: "11"
- date: "May 15, 1944"
  time: "2008"
  zone: "K"
  part: "I"
  event: "Surfaced."
  page: "11"
- date: "May 15, 1944"
  time: "2300"
  zone: "K"
  part: "I"
  event: "Shifted area in accordance with PENTATHLON schedule."
  page: "11"
- date: "May 16, 1944"
  time: "0456"
  zone: "K"
  part: "I"
  event: "Dove East of SAIPAN. Sighted many planes during the day, and three sampans. Looked into LAULAU harbor and SAIPAN CHANNEL. Definitely spotted a rotating bedspring radar mast at Lat. 15-06-12N, Long. 145-45-14 E. No shipping sighted in LAULAU or SAIPAN CHANNEL."
  page: "11"
  flags: "The position typed is the radar mast's on shore, not the boat's, so it is not entered as a position."
- date: "May 16, 1944"
  time: "2005"
  zone: "K"
  part: "I"
  event: "Surfaced."
  page: "11"
- date: "May 17, 1944"
  time: "0000"
  zone: "K"
  part: "I"
  event: "Radar interference bearing 200 T., headed toward, probably GABILAN. About 0100 heard distant explosions."
  page: "11"
- date: "May 17, 1944"
  time: "0130"
  zone: "K"
  part: "I"
  event: "Made radar contact bearing 299 T., distance 16,500 yards. Commenced tracking and made end around run down moon. Too light for night surface attack, too dark for night periscope attack. Decided to wait until dawn. S/C #6."
  page: "11"
- date: "May 17, 1944"
  time: "0444"
  zone: "K"
  part: "I"
  event: "[SUMMARY] Dove for attack with target bearing 160 T., 15,570 yards: a lightly loaded 4,000 ton MFM counter-stern freighter with four escorts (2 DE type, 1 PC, 1 trawler-type escort). Best shot was a bow shot, 120 track, 3500 yards; held fire in the calm sea. A vessel had followed the boat during the end-around at about 19 knots and a submarine was seen astern. The escorts appeared to pick the boat up by sound and put themselves between it and the target; passed within 150 yards of one escort, which did not drop. During the day closed SAIPAN CHANNEL; many SALLYS and ZEKES, no shipping or patrol boats, no evidence of sono-buoys."
  page: "11"
- date: "May 17, 1944"
  time: "2007"
  zone: "K"
  part: "I"
  event: "Surfaced and patrolled to eastward of SAIPAN."
  page: "12"
- date: "May 18, 1944"
  time: "0232"
  zone: "K"
  part: "I"
  event: "O.O.D. and QM sighted possible impulse bubble bearing 215 T., distance 1500 yards, and simultaneously sound reported screws and high noise level and in same direction. Maneuvered to avoid. A possible submarine contact is indicated."
  page: "12"
- date: "May 18, 1944"
  time: "0403"
  zone: "K"
  part: "I"
  event: "Sighted about 10 starshells in the direction of SAIPAN, headed toward."
  page: "12"
- date: "May 18, 1944"
  time: "0451"
  zone: "K"
  part: "I"
  event: "Dove and conducted submerged patrol off LAULAU BAY and SAIPAN CHANNEL. Sighted many planes but no ships."
  page: "12"
- date: "May 18, 1944"
  time: "2010"
  zone: "K"
  part: "I"
  event: "Surfaced. During night headed south along GUAM-SAIPAN route and then eased out to eastward to conduct a surface patrol southeast of GUAM."
  page: "12"
- date: "May 19, 1944"
  zone: "K"
  part: "I"
  event: "Conducted surface patrol in area southeast of GUAM, nothing sighted."
  page: "12"
- date: "May 19, 1944"
  time: "1954"
  zone: "K"
  part: "I"
  event: "Picked up interference on SJ from another SJ. Probably SANDLANCE. S/C #7. Closed, tracked for a short time, and attempted to exchange calls, knowing that she was out of torpedoes and might be in contact. No success. Headed toward PORT APRA, not in our area, but SANDLANCE is vacating it and adjacent area to northward is also vacant."
  page: "12"
  flags: "Time typed '1954.'"
- date: "May 20, 1944"
  time: "0126"
  zone: "K"
  part: "I"
  event: "Doubtful radar contact bearing 330 T., distance 29,000 yards. Went ahead 20 knots on course 330 T."
  page: "12"
- date: "May 20, 1944"
  time: "0220"
  zone: "K"
  part: "I"
  event: "Contact was not picked up again, slowed down and headed for PORT APRA."
  page: "12"
  flags: "Time typed '-220' (a dash in place of the first 0)."
- date: "May 20, 1944"
  time: "0457"
  zone: "K"
  from: "OROTE PT."
  bearing: "W"
  distance: "16 miles"
  part: "I"
  event: "Dove 16 miles west of OROTE PT. Just prior to diving three separate lights on island had signalled ⟦A⟧. Possible we were detected. Previously had dove 9 miles off without any indication of detection. Throughout the day sighted numerous planes. Counted seven ships in the harbor. About noon started hearing random depth charging, started closing \"Hole in the Wall\"."
  page: "13"
  flags: "Signal letter over-inked (Gemini read [?A?])."
- date: "May 20, 1944"
  time: "1443"
  zone: "K"
  part: "I"
  event: "SHIP CONTACT # 8 - ATTACK # 3 - TWO HITS. Sighted smoke bearing 030 T., also a MAVIS and RUFE patrolling in same general direction. Came to normal course and maintained bearing steady. During the entire approach did not change course once, but adjusted speed as necessary to keep bearing constant. Target developed into a transport similar to ATUTA MARU, p. 52, ONI 208-J Revised, with at least four escorts, and there were possibly one or more large ships well astern, but they were not clearly seen as attention was focused on target."
  page: "13"
- date: "May 20, 1944"
  time: "1553"
  zone: "K"
  tag: "attack"
  title: "Attack 3 · two hits"
  part: "I"
  charges: "61"
  event: "[SUMMARY] Let target steady down on a zig toward and fired four bow tubes, gyros near zero, track about 60 stbd, torpedo run 1600 yards. Went deep as an escort was close aboard to port. Heard two timed hits; the first barrage landed as the boat passed 150 feet. Four escorts and planes 'turned to on us with a vengeance', evasion limited by the nearby shore; the escorts made simultaneous runs coached by a fourth pinging abeam. Sixty one charges were dropped, including one salvo of twenty four in rapid succession; possible breaking up noises on the bearing of the attack."
  page: "13"
- date: "May 20, 1944"
  time: "1820"
  zone: "K"
  part: "I"
  event: "At periscope depth. One PC was about 3,000 yards away, listening."
  page: "13"
- date: "May 20, 1944"
  time: "2000"
  zone: "K"
  part: "I"
  event: "Preparing to surface, one pinger heard loudly and another in the distance. Came up to radar depth, closest escort bears 160 T., distance 6,750 yards, range closed to 4,000 yards on steady bearing. Went deep for an hour and escort lost contact."
  page: "13"
- date: "May 20, 1944"
  time: "2111"
  zone: "K"
  part: "I"
  event: "Surfaced and cleared area. Patrolled to west and southwest of GUAM."
  page: "13"
- date: "May 21, 1944"
  time: "0455"
  zone: "K"
  part: "I"
  event: "Dove for submerged patrol."
  page: "14"
- date: "May 21, 1944"
  time: "0717"
  zone: "K"
  part: "I"
  event: "Heard five distant depth charges, headed toward PORT APRA. During morning heard distant echo ranging, but could not see any signs of a convoy."
  page: "14"
- date: "May 21, 1944"
  time: "1400"
  zone: "K"
  part: "I"
  event: "Sighted mast bearing 092 T., distance 10 miles, apparently one of the two sources of pinging. Commenced high speed approach. This contact developed into a MUTSUKI Class destroyer who was patrolling at about 12 knots. For the next two hours and a half we made approaches on him, and had all tubes ready for firing. His zig plan was unpredictable and very discouraging. Once we thought we had him for sure, but he zigged away just at the wrong time. If we had circled when we first picked him up he would have passed close aboard. S/C #9."
  page: "14"
- date: "May 21, 1944"
  time: "1723"
  zone: "K"
  part: "I"
  event: "DD was joined by a PC, to which he signalled \"FW\" \"K\"."
  page: "14"
- date: "May 21, 1944"
  time: "2020"
  zone: "K"
  part: "I"
  event: "Surfaced. Tuned up SJ on land as it was jarred out of adjustment by charges of yesterday."
  page: "14"
- date: "May 22, 1944"
  zone: "K"
  part: "I"
  event: "Surface patrol west of SAIPAN."
  page: "14"
- date: "May 22, 1944"
  time: "1108"
  zone: "K"
  part: "I"
  event: "Dove upon sighting an EMILY bearing 190 T., distance 15 miles. A/C #9."
  page: "14"
- date: "May 22, 1944"
  time: "1125"
  zone: "K"
  part: "I"
  event: "Surfaced and resumed patrol."
  page: "14"
- date: "May 22, 1944"
  time: "1315"
  zone: "K"
  part: "I"
  event: "Sighted submarine, bearing 009 T., distance 15 miles, probably friendly."
  page: "14"
- date: "May 22, 1944"
  time: "1348"
  zone: "K"
  part: "I"
  event: "Sighted submarine again, bearing 000 T. Presented silhouette to him then attempted to close to exchange information. S/C #10."
  page: "14"
- date: "May 22, 1944"
  time: "1353"
  zone: "K"
  part: "I"
  event: "Other submarine dove. Sent recognition and own call by sound, no reply. Put him abaft beam and continued patrol."
  page: "14"
- date: "May 22, 1944"
  time: "1624"
  zone: "K"
  part: "I"
  event: "Sighted another submarine bearing 314 T., distance 12 miles. Again presented silhouette and then started to close. S/C # 11."
  page: "14"
- date: "May 22, 1944"
  time: "1630"
  zone: "K"
  part: "I"
  event: "Other submarine dove. This could not be the same submarine sighted previously, but was believed to be friendly. Put submarine abaft beam and continued patrol. These two contacts emphasizes the need for some rapid means of identification and communication."
  page: "14"
- date: "May 22, 1944"
  time: "2003"
  zone: "K"
  part: "I"
  event: "Made radar contact bearing 150 T., distance 13,500 yards. From SJ interference it was another friendly submarine. Closed and sent out call by blinker tube but other sub kept turning away. Desired to exchange information. Actions of other sub indicated that he was not in contact with enemy so resumed patrol. S/C #12."
  page: "15"
- date: "May 23, 1944"
  zone: "K"
  part: "I"
  event: "Surface patrol west of SAIPAN."
  page: "15"
- date: "May 23, 1944"
  time: "1414"
  zone: "K"
  lat: "15-49 N"
  lon: "143-22.5 E"
  part: "I"
  event: "Passed close aboard an abandoned standard clinker built lifeboat with Jap insignia and numeral 2 painted on it. Lat. 15-49' N. Long 143- 22.5' E."
  page: "15"
  flags: "Position typed 'Lat. 15- 49' N. Long 143- 22.5' E.' for the lifeboat, passed close aboard; used as the boat's position."
- date: "May 23, 1944"
  time: "1952"
  zone: "K"
  part: "I"
  event: "Radar contact. Closed to investigate. At 5,000 yards pip (saturation size) disappeared. Could see nothing. Probably a submarine that dove. Searched area at high speed for about an hour but could not regain contact. Could be friend or foe. S/C #13."
  page: "15"
- date: "May 24, 1944"
  time: "0500"
  zone: "K"
  from: "GUAM"
  bearing: "NW"
  distance: "25 miles"
  part: "I"
  event: "Dove about twenty five miles northwest of GUAM."
  page: "15"
- date: "May 24, 1944"
  time: "0603"
  zone: "K"
  part: "I"
  event: "In the next hour heard about six distant depth charges. Headed toward PORT APRA."
  page: "15"
- date: "May 24, 1944"
  time: "0705"
  zone: "K"
  part: "I"
  event: "Picked up echo ranging bearing 185 T. Commenced high speed approach. Contact developed into two ships with two or more escorts. One ship was an 8,000 ton transport and the other a 2,000 ton engine aft AK. Usual air coverage. S/C #14."
  page: "15"
- date: "May 24, 1944"
  time: "0836"
  zone: "K"
  part: "I"
  event: "Secured approach, could not get closer than 7500 yards. Convoy was northbound and hugging shore, passing close to PT. RITIDIAN. Throughout the day heard several distant depth charges but nothing was sighted."
  page: "15"
- date: "May 24, 1944"
  time: "1953"
  zone: "K"
  part: "I"
  event: "Surfaced. Headed north to patrol west of SAIPAN tomorrow."
  page: "15"
- date: "May 25, 1944"
  time: "0204"
  zone: "K"
  part: "I"
  event: "SJ contact on plane at 11,000 yards, closed to 8,000 and opened out. A/C #10."
  page: "15"
- date: "May 25, 1944"
  time: "0303"
  zone: "K"
  part: "I"
  event: "SJ contact on plane at 9500 yards, closed slowly to 6,000 and opened out. A/C #11."
  page: "15"
- date: "May 25, 1944"
  time: "0343"
  zone: "K"
  part: "I"
  event: "SJcontact on plane at 13,400 yards, started closing rapidly so at"
  page: "15"
- date: "May 25, 1944"
  time: "0345"
  zone: "K"
  part: "I"
  event: "Dove for submerged patrol west of SAIPAN."
  page: "15"
- date: "May 25, 1944"
  time: "0915"
  zone: "K"
  part: "I"
  event: "Picked up echo ranging and smoke bearing 105 T. Commenced high speed approach. Contact developed into one 8,000 ton transport and 7,000. ton four goal poster AK with a DD and AM7 class escorts plus air escort of MAVIS and JAKE. S/C #15."
  page: "16"
- date: "May 25, 1944"
  time: "1025"
  zone: "K"
  part: "I"
  event: "Obtained minimum range of 3400 yards. Torpedo run excessive for calm sea. Started trailing at 6 knots."
  page: "16"
- date: "May 25, 1944"
  time: "1425"
  zone: "K"
  part: "I"
  event: "Lost contact with convoy's smoke. Base course appears to be 285 T. Started to surface several times but each time sighted a plane either going to convoy or returning from convoy."
  page: "16"
- date: "May 25, 1944"
  time: "1602"
  zone: "K"
  part: "I"
  event: "Surfaced. Battery low, putting in quick charge and chasing at 15 knots."
  page: "16"
- date: "May 25, 1944"
  time: "1654"
  zone: "K"
  part: "I"
  event: "Dove on sighting plane en route SAIPAN to convoy. Continued trailing high speed submerged. Do not believe we were sighted by plane although when we slowed down every half hour. for a look, planes were sighted each time."
  page: "16"
- date: "May 25, 1944"
  time: "1924"
  zone: "K"
  part: "I"
  event: "Surfaced and started chasing at full speed. Estimate convoy has about a 40 mile lead."
  page: "16"
- date: "May 26, 1944"
  time: "0100"
  zone: "K"
  part: "I"
  event: "On convoy 10 knot circle, started retiring search curve to southward."
  page: "16"
- date: "May 26, 1944"
  time: "0600"
  zone: "K"
  part: "I"
  event: "Having searched about 50° to southward of convoy's estimated base course started sweep to northward."
  page: "16"
- date: "May 26, 1944"
  time: "1245"
  zone: "K"
  lat: "15-58 N"
  lon: "140-50 E"
  part: "I"
  event: "Passed through debris which consisted mainly of many oil drums. Lat 15°-58 N. Long 140°-50' E."
  page: "16"
- date: "May 26, 1944"
  time: "1347"
  zone: "K"
  part: "I"
  event: "Sighted submarine bearing 273 T., distance 15 miles. Both turned away, then both turned toward. From silhouette, submarine appeared to be friendly."
  page: "16"
- date: "May 26, 1944"
  time: "1411"
  zone: "K"
  part: "I"
  event: "Other submarine dove, distance. about 8 miles. Transmitted recognition signal and own call over sound gear, then presented beam to submarine and continued search."
  page: "16"
- date: "May 26, 1944"
  time: "1951"
  zone: "K"
  part: "I"
  event: "Secured search, convoy was probably making better speed than we had estimated. During evening converted 3A and B to main ballast tanks."
  page: "16"
- date: "May 27, 1944"
  time: "0735"
  zone: "K"
  part: "I"
  event: "Made short trim dive and then conducted surface patrol."
  page: "17"
- date: "May 28, 1944"
  time: "0554"
  zone: "K"
  part: "I"
  event: "Dove upon sighting a MAVIS bearing 278 T., distance 8 miles. Headed toward, in case he was covering a convoy. A/C #13."
  page: "17"
- date: "May 28, 1944"
  time: "0720"
  zone: "K"
  part: "I"
  event: "Surfaced."
  page: "17"
- date: "May 28, 1944"
  time: "0726"
  zone: "K"
  part: "I"
  event: "SHIP CONTACT # 17 - ATTACK # 4 - FOUR HITS. Sighted smoke bearing 245 T. Tracked and commenced end-around run, convoy apparently on base course 150 T. and making about 7 knots."
  page: "17"
- date: "May 28, 1944"
  time: "1311"
  zone: "K"
  part: "I"
  event: "Sighted MAVIS over convoy bearing 300 T., distance 12 miles headed our way. Dove. Continued tracking convoy from ahead. Sea was calm, decided to make night attack if could keep contact with convoy until sunset."
  page: "17"
- date: "May 28, 1944"
  time: "1700"
  zone: "K"
  part: "I"
  event: "As convoy went by, had a chance to look them over. It appeared to consist of two AK's, one ⟦1FM⟧ 5,000 ton, and one MKKF 3,000 ton, escorted by one CHIDORI leading, a PC on each beam, and an engine aft small escort freighter astern."
  page: "17"
  flags: "Type letters before '5,000 ton' unclear (Gemini read [?1FM?])."
- date: "May 28, 1944"
  time: "1947"
  zone: "K"
  part: "I"
  event: "Surfaced and pursued."
  page: "17"
- date: "May 28, 1944"
  time: "2005"
  zone: "K"
  part: "I"
  event: "Contacted convoy on radar, started tracking, keeping down moon."
  page: "17"
- date: "May 28, 1944"
  time: "2340"
  zone: "K"
  part: "I"
  event: "Moonset, started closing to track more accurately."
  page: "17"
- date: "May 29,1944"
  zone: "K"
  part: "I"
  event: "Tracking convoy, at midnight convoy made large change in base course just as we were starting approach. Could see them signalling amongst themselves. Opened out and tracked on new base course and adjusted position to come in on stbd bow of convoy."
  page: "17"
- date: "May 29,1944"
  time: "0115"
  zone: "K"
  part: "I"
  event: "Made all tubes ready and started in for approach."
  page: "17"
- date: "May 29,1944"
  time: "0133"
  zone: "K"
  tag: "attack"
  title: "Attack 4 · four hits, two ships sunk"
  part: "I"
  charges: "26"
  event: "Fired six tubes forward; firing three at each AK. Fired a little sooner than had planned, as leading escort had started to turn toward, and stbd escort was dead ahead range 2,000 yards. Used one degree diverzcnt spread, torpedo run 3400 yards first torpedo, gyros about 030, track 80 stbd. [page 18] 0135 Heard and saw two hits in each AK, followed by tremendous explosions and flames which lit up the whole scene almost as bright as day. Turned away and went ahead emergency. Escorts closed to 1650 yards and then slowly opened out. Escorts were probably blinded by the holocaust which was now raging astern and added to the confusion by dropping twenty six depth charges. Both AK pips disappeared from the radar screen within three minutes from the time they were hit and it is doubtful that any of the crews survived. Ships were apparently loaded with gasoline and a million or so gallons burning is truly an awe-inspiring spectacle."
  page: "17"
  flags: "The 0135 entry (page 18) is joined to the firing entry."
- date: "May 29,1944"
  time: "0210"
  zone: "K"
  part: "I"
  event: "Secured from battle stations. Had interference from another SJ to southward, probably TUNNY."
  page: "18"
- date: "May 29,1944"
  time: "0400"
  zone: "K"
  part: "I"
  event: "Flames still visible 30 miles away."
  page: "18"
- date: "May 29,1944"
  time: "0508"
  zone: "K"
  part: "I"
