  part: "I"
  event: "Dove northwest of SAIPAN for submerged patrol."
  page: "18"
- date: "May 30, 1944"
  time: "0903"
  zone: "K"
  part: "I"
  event: "SHIP CONTACT # 18 - ATTACK # 5 - MISSED. Sighted smoke bearing 208 T. Started high speed approach. Could not close, started trailing at high speed. During day sighted several planes, a sampan, and convoy had air cover of a MAVIS and a JAKE."
  page: "18"
- date: "May 30, 1944"
  time: "1600"
  zone: "K"
  part: "I"
  event: "Lost sight of smoke. Could not surface due to numerous planes sighted."
  page: "18"
- date: "May 30, 1944"
  time: "1906"
  zone: "K"
  part: "I"
  event: "Sighted a patrol boat or PC which was returning from direction convoy last sighted toward SAIPAN. Difficult to identify due to darkness. Passed close aboard."
  page: "18"
- date: "May 30, 1944"
  time: "2010"
  zone: "K"
  part: "I"
  event: "Surfaced and started pursuing convoy, conducting retiring search curve. Transmitted contact report."
  page: "18"
- date: "May 31, 1944"
  time: "0520"
  zone: "K"
  part: "I"
  event: "Sighted smoke, bearing 180 T. Convoy was on retiring search curve, but we had covered zigs to the right first and he had zigged to the left. Have yet to outguess the sunset zigs. Commenced end-around run on convoy."
  page: "19"
- date: "May 31, 1944"
  time: "0547"
  zone: "K"
  part: "I"
  event: "Sighted an EMILY over convoy. Had HIM in sight most of day and he actually aided end-around run as he stayed near convoy and could be seen sometimes when smoke was lost."
  page: "19"
- date: "May 31, 1944"
  time: "1220"
  zone: "K"
  part: "I"
  event: "Ahead of convoy, dove to look them over. Sea glassy and decided best chance was a night attack. Convoy was found to consist of two ⟦1FM⟧ coal burning 5,500 ton freighters, one KFK 5,300 ton diesel freighter similar to HOKUKU MARU, plus three SC escorts and a small escort freighter or trawler astern."
  page: "19"
  flags: "Type letters unclear (Gemini read [?1FM?]). The attack 5 form has 2 MFM 5,500 ton freighters and a KFK of 3,300 tons."
- date: "May 31, 1944"
  time: "1913"
  zone: "K"
  part: "I"
  event: "Surfaced with smoke plainly in sight. Closed to gain radar contact, tracked and started end-around down moon."
  page: "19"
- date: "May 31, 1944"
  time: "2127"
  zone: "K"
  tag: "rendezvous"
  title: "Exchanged calls with SHARK"
  part: "I"
  with: "SHARK"
  event: "Sighted submarine bearing 070 T., distance 6,500 yards, Determined to be friendly from radar interference. Sub challenged and we exchanged recognition signals. Exchanged calls, sub was SHARK (unpass call was garbled). S/C #19. Attempted to signal dope on convoy but communication by blinker at night is not satisfactory, and when in contact with a convoy is apt to give the show away."
  page: "19"
- date: "June 1, 1944"
  time: "0206"
  zone: "K"
  part: "I"
  event: "Moonset. Started dropping back for stern tube approach ( no torpedoes forward)."
  page: "19"
- date: "June 1, 1944"
  time: "0246"
  zone: "K"
  part: "I"
  event: "Escort on stbd bow of convoy turned on two red lights when range was about 5,600 yards. Possible he was suspicious as he speeded up but did not open fire. Speeded up, eased out ahead, and decided to try port bow."
  page: "19"
- date: "June 1, 1944"
  time: "0328"
  zone: "K"
  part: "I"
  event: "Now dead ahead of convoy range about 3,500 yards. Convoy in column formation."
  page: "19"
- date: "June 1, 1944"
  time: "0330"
  zone: "K"
  part: "I"
  event: "Convoy made large left zig by column movement. Decided this was best shot we would get."
  page: "19"
- date: "June 1, 1944"
  time: "0333"
  zone: "K"
  tag: "attack"
  title: "Attack 5 · all missed"
  part: "I"
  event: "Fired four torpedoes. Torpedo run 3300 yards, about 70 stbd track, gyros about 180. Started easing out, we were not sighted and convoy did not zig or give any indication they knew we were around. Had fired two at leading ship and two at second ship. Torpedoes were heard to run normally but all missed."
  page: "19"
- date: "June 1, 1944"
  time: "0340"
  zone: "K"
  part: "I"
  event: "Heard explosion probably end of run."
  page: "20"
- date: "June 1, 1944"
  time: "0342"
  zone: "K"
  part: "I"
  event: "Heard two explosions probably depth charges."
  page: "20"
- date: "June 1, 1944"
  time: "0435"
  zone: "K"
  part: "I"
  event: "Sent visual message to SHARK, telling her our attack was completed and wishing her better luck. No receipt for message."
  page: "20"
- date: "June 1, 1944"
  time: "0440"
  zone: "K"
  part: "I"
  event: "Sighted large explosion and saw large flare up of light in direction of convoy. Someone was getting in an attack, possibly there is more than one friendly sub in vicinity, as SJ radar interference has been heavy all night."
  page: "20"
- date: "June 1, 1944"
  time: "0445"
  zone: "K"
  part: "I"
  event: "0445-0449 Heard some more explosions, probably depth charges."
  page: "20"
- date: "June 1, 1944"
  time: "0453"
  zone: "K"
  part: "I"
  event: "Fired a yellow, red, and green rocket from Very pistol, hoping it would draw off escorts and confuse them. Set course for Pearl as other sub was in contact with convoy."
  page: "20"
- date: "June 1, 1944"
  time: "1057"
  zone: "K"
  part: "I"
  event: "Sighted smoke and an EMILY bearing 131 T. This was definitely another convoy. Started tracking and course was about 320 T."
  page: "20"
- date: "June 1, 1944"
  time: "1140"
  zone: "K"
  part: "I"
  event: "Sent contact report to Comsubpac and reported results of last attack and dope on other convoy. After we expend our torpedoes we seem to attract contacts like flypaper."
  page: "20"
- date: "June 1, 1944"
  time: "1300"
  zone: "K"
  part: "I"
  event: "Lost sight of EMILY. He apparently left convoy about this time."
  page: "20"
- date: "June 1, 1944"
  time: "1730"
  zone: "K"
  tag: "rendezvous"
  title: "Rendezvous with PILOTFISH"
  part: "I"
  with: "PILOTFISH"
  event: "Sighted submarine bearing 295 T., distance 12 miles. Closed, showed silhouette, and closed again. As we closed both fired emergency identification flares and closed to easy visual signalling distance. Submarine was U.S.S. PILOTFISH and apparently had taken prompt action on our contact report. Gave him dope on convoy, then departed area headed for Pearl. S/C #21."
  page: "20"
- date: "June 2, 1944"
  time: "0730"
  zone: "K"
  part: "I"
  event: "Passed between ASUNCION and AGRIHAN ISLANDS, surface running, apparently undetected. During morning transmitted message to CTF 17 giving last dope on convoy in answer to request for information on any changes. Atmospheric conditions bad. Considerable delay in getting message through and finally cleared to Australian station. Also broadcast on 450 KCs a despatch to the FLIER giving convoy's last position in case she was able to intercept."
  page: "20"
