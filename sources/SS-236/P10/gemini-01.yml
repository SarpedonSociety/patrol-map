  event: "Ship had seemed on verge of sinking all morning, but was still hanging on. Close inspection showed it to be abandoned, called for 4\" and 40 MM crew and was about to surface and sink it with gunfire when a \"BETTY\" (A/C#3) appeared over the horizon and dampened our enthusiasm. Decided to wait a little while longer and if it still didn't sink would ventilate it with a torpedo. Its back was broken and with each swell could see the bow and stern working. Close inspection showed it to check closely with the picture of the MIKAGE MARU #18, 4319 T., ONI 208 J (Revised) p.111."
  page: "7"
