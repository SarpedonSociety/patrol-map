# USS Silversides (SS-236), War Patrol 10
# Brisbane by Milne Bay to the Marianas (Area 14: Guam, Saipan and the PENTATHLON areas), then to Pearl Harbor.
# Five torpedo attacks: 8 May off Port Apra (one hit), 10 May dawn convoy attack (five hits, MIKAGE MARU #18 seen
# to sink), 20 May off Port Apra (two hits), 29 May night surface attack (two gasoline-laden AKs blew up and sank),
# 1 June (all missed, last torpedoes).
# Sources: Gemini read the report verbatim in fresh chats (check-gemini-01..07.md, check-contacts-01.md,
# check-attacks-01..02.md, plus the three endorsements, kept with the vault copies). Claude put those reads into
# the converter's layouts on 2026-11-03: gemini-01.yml (narrative, pages 1-20), contacts-01.md (Parts F and G,
# pages 21-23), contacts-02.md (Part O density layers, page 32) and attacks-01.md (forms, pages 24-29). Nothing
# has been checked against the scan yet; open items are in review.yml.
# Page numbers: the typed number at the foot of each page. The Fold3 page number is the typed number plus one.
# Index figures from the PSO's INDEX SS.236.10: report no. 454, 23,600 tons sunk, 18,000 damaged.

boat: SS-236
patrol: 10
year: 1944
report_found: yes
report: "U.S.S. SILVERSIDES - REPORT OF TENTH WAR PATROL"
comsubpac_report_no: 454
commanding_officer: "J.S. COYE, Jr."

