# Torpedo attack results for the map marker, from the Hit or Miss lines on the forms. The forms have no hits
# column, so they are set by hand. Keys are the ids on the detail cards: entries run through contacts-01.md
# (ship contacts 1-21, aircraft 22-37), contacts-02.md (density layers 38-46) and attacks-01.md (attack n is
# entry 46+n).
results:
  A47: hit    # attack 1: tube 7 hit
  A48: hit    # attack 2: five hits
  A49: hit    # attack 3: tubes 2 and 3 hit
  A50: hit    # attack 4: four hits
  A51: miss   # attack 5: all four missed
