  page: "7"
- date: "30 October"
  time: "2009"
  zone: "I"
  part: "I"
  event: "2009-23. Heard 32 depth charges. Remained at periscope depth but could not see escorts, although from the sound of the screws the original three must have multiplied. Could no longer see tanker, believe sank, headed out on course 060."
  page: "7"
  flags: "Typed '2009-23' (a span)."
- date: "30 October"
  time: "2025"
