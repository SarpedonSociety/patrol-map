  event: "An escort bearing 270 T. started shooting at us at about 9,000 yards."
  page: "7"
- date: "30 October"
  time: "2325"
  zone: "I"
  part: "I"
  event: "Came to course 110, range closed rapidly to 8,000 yards. Could not hold range open as two engines were out of commission."
  page: "8"
- date: "30 October"
  time: "2329"
  zone: "I"
  tag: "counterattack"
  title: "Gunfire; dove"
  part: "I"
  event: "Dove, gun fire was on in deflection, short about 200 yards. Remained at periscope depth and swung to 000 T., to get a stern shot. Escort would not oblige and kept his distance. Headed toward on course 290 T."
  page: "8"
  damage: "None reported"
- date: "31 October"
