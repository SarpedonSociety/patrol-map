  page: "7"
- date: "30 October"
  time: "2206"
  zone: "I"
  part: "I"
  event: "Heard possible breaking up noises from direction of tanker."
  page: "7"
- date: "30 October"
  time: "2225"
  zone: "I"
  part: "I"
  event: "Surfaced. Had at least six escorts or possibly some submarines all around the horizon, bright moonlight, closest range about 9,000 yards. Attempted to identify targets and clarify situation. From radio messages learned SALMON damaged and was the submarine in the gun battle. Headed toward gun flashes to attempt to draw off escorts."
  page: "7"
- date: "30 October"
  time: "2322"
  zone: "I"
