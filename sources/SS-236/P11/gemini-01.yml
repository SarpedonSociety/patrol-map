  page: "5A"
- date: "27 October"
  time: "1109"
  zone: "I"
  part: "I"
  event: "AIRCON #34. First indication of this one was the sound of his engines, estimated elevation 50°. BETTY Type. Dove. No bombs, possibly he did not see us."
  page: "5A"
  flags: "Time 1109 from Bonsai's read and the aircraft table; Qwen put it after the entry."
- date: "28 October"
  time: "0200"
  zone: "I"
  tag: "notable"
  title: "Hydraulic plant out of commission"
  part: "I"
  event: "Passed between ISHIGAKI JIMA and TIRAM JIMA proceeding to form scouting line at full speed. Hydraulic plant out of commission all night while working on a cantankerous drum controller known as Portsmouth Pride and Joy. During day conducted high speed surface sweep of southern approaches to OKINAWA JIMA."
  page: "5A"
  flags: "Qwen read TIRAM, Bonsai TARAWA; TARAMA JIMA is meant."
- date: "29 October"
  time: "0000"
  zone: "I"
  part: "I"
  event: "C/c to 044 to head for 30 N., 135 E."
  page: "5A"
  flags: "30 N, 135 E is the destination, not the boat's position."
- date: "29 October"
  time: "0942"
  zone: "I"
  part: "I"
  event: "Sighted several heavy oil slicks, general direction 330 to 010 T. Turned down them to follow them up and made up contact report to send out to pack."
  page: "5A"
- date: "29 October"
  time: "1009"
  zone: "I"
  part: "I"
  event: "Received message from TRIGGER stating she had stighted tops of ships in Lat. 26-09 N., Long. 130-44 on course 130 T., speed 6 knots (apparently headed toward OAGARI SHIMA) and that she was diving for attack. On assumption that tops were better than an oil slick, headed full speed toward TRIGGER, who was well to south of us."
  page: "5A"
  flags: "The position is TRIGGER's contact, not this boat's (TRIGGER's contact table: contact 9, 0912 (I), 26-10 N 130-39 E). Qwen read OAGIRI, Bonsai OAGARI: OAGARI (Daito) fits the position."
- date: "29 October"
  time: "1303"
  zone: "I"
  part: "I"
  event: "Received TRIGGER message reporting contact was 5 sampans and 2 PC's and suggesting gun attack. Sent TRIGGER message to attack at discretion but that we were heading back toward oil slicks. These were closer to us and decided possible contact with damaged major fleet units was worth all the sampans in Japan."
  page: "5A"
  flags: "Time 1303 from Bonsai's read; Qwen has no time on this line. TRIGGER's report has her message at 1255 and SILVERSIDES' reply at 1310."
- date: "29 October"
  time: "1557"
  zone: "I"
  part: "I"
  event: "Sighted possible oil slicks again, but they were very indefinite. Altered course toward BUNGO SUIDO."
  page: "6"
- date: "29 October"
  time: "2206"
  zone: "I"
  part: "I"
  event: "Sent despatch to TRIGGER and SALMON assigning independent search for tomorrow as pack had become dispersed, and assigned a rendezvous for 2000 tomorrow."
  page: "6"
- date: "30 October"
  time: "0455"
  zone: "I"
  part: "I"
  event: "(Note: All times still (I).) Received SALMON report of two radar contacts in Lat. 28-43 N., Long. 131-22 E., course 050, speed 12, stating she was attacking port flank. Headed to intercept. Had interference from three other SJ radars."
  page: "6"
  flags: "The position is SALMON's contact, not this boat's. Time 0455 placed by Bonsai's read; Qwen ran it after the day heading."
- date: "30 October"
  time: "0642"
  zone: "I"
  tag: "attack"
  title: "Attack 1: tanker, one premature"
  part: "I"
  event: "SHIPCON #5. Attack #1. Sighted a ship and escort bearing 247 T., distance 14 miles."
  page: "6"
- date: "30 October"
  time: "0647"
  zone: "I"
  part: "I"
  event: "Move to attack, as we were approximately on target track and our background rapidly getting light. Commenced high speed submerged approach, endeavoring to keep target's true bearing constant. Target materialized into a large tanker with at least three escorts, leading escort probably a DE or frigate. Sea conditions ideal for periscope attacks. Tanker was light, set torpedoes at 6 feet which was about the minimum the force 2 sea allowed."
  page: "6"
  flags: "Typed 'Move to attack' (both reads); probably 'Dove'. Check the scan."
- date: "30 October"
  time: "0757"
  zone: "I"
  part: "I"
  event: "In ideal position, AOB 15 starboard, range 4,000, target due for zig towards, heading between leading and starboard quarter escort."
  page: "6"
- date: "30 October"
  time: "0759"
  zone: "I"
  part: "I"
  event: "Target zigged away and presented a 70 starboard AOB. Torpedo run was not getting smaller."
  page: "6"
  flags: "Time 0759 from Bonsai's read; Qwen has no time on this line and puts 0759 on the next."
- date: "30 October"
  time: "0800"
  zone: "I"
  part: "I"
  event: "Target was steady on course. Torpedo run was larger than desired, but plot and TDC were checking, and we were shooting wakeless Mk.18 torpedoes."
  page: "6"
  flags: "Time 0800 from Bonsai's read (Qwen 0759)."
- date: "30 October"
  time: "0801"
  zone: "I"
  tag: "attack"
  title: "Attack 1: six torpedoes at tanker"
  part: "I"
  event: "Commenced firing bow tubes. Fired 6 torpedoes, average torpedo run 3300 yards, track about 100 S., gyros near zero, 10 second firing interval using an aimed spread which covered 150 per cent of target length."
  page: "6"
- date: "30 October"
  time: "0802"
  zone: "I"
  tag: "notable"
  title: "Torpedo premature"
  part: "I"
  event: "Ten seconds after last torpedo had been fired, heard and felt an explosion that jarred our back teeth. As nearest escort was about 1200 yards away this could only have been a premature. (Tanker had no air cover). Had hoped to be able to watch the hits and set up the stern tubes on an escort but premature thoroughly alerted the target and escorts so went deep."
  page: "6"
- date: "30 October"
  time: "0805"
  zone: "I"
  tag: "counterattack"
  title: "Depth-charged after attack 1"
  charges: "14"
  part: "I"
  event: "Depth charging started. Only fourteen charges were dropped and none were as close as the premature. Apparently they lost us under a gradient. Heard one explosion that did not sound like a depth charge at 3 minutes and ten seconds after first torpedo left the tube. This indicates one possible hit, but premature had offered target ample time to maneuver."
  page: "6"
- date: "30 October"
  time: "0833"
  zone: "I"
  part: "I"
  event: "Last depth charge."
  page: "6"
- date: "30 October"
  time: "0854"
  zone: "I"
  part: "I"
  event: "Escort screws fading out. Started up to periscope depth."
  page: "6"
- date: "30 October"
  time: "0930"
  zone: "I"
  part: "I"
  event: "At periscope depth. All clear. Commenced reload forward and exchanging torpedoes in after tubes with those in racks, as tubes had been flooded."
  page: "7"
- date: "30 October"
  time: "1048"
  zone: "I"
  part: "I"
  event: "Surfaced and started pursuit. Sent out contact report to SALMON, TRIGGER and WOGAN'S WOLVES. During the next few hours received contact reports from SALMON and TRIGGER. Also request for information from WOGAN'S WOLVES (BESUGO and RONQUIL) and STERLIT. Contact information was plentiful, but reports of position did not always agree as some boats had been able to get morning stars, and others were forced to go by D.R. The tanker was literally surrounded by six submarines. Weather was hazy, occasional squalls."
  page: "7"
  flags: "Typed STERLIT (both reads) at the first mention."
- date: "30 October"
  time: "1616"
  zone: "I"
  part: "I"
  event: "Sighted tanker coming out of haze bearing 315 T., distance 19,000 yards. Started tracking."
  page: "7"
- date: "30 October"
  time: "1619"
  zone: "I"
  tag: "rendezvous"
  title: "TRIGGER's attack on the tanker seen"
  with: "TRIGGER"
  part: "I"
  event: "Sighted at least two hits in tanker. Tanker took a big up angle, slowed down and finally stopped. Sent out contact report. (This was TRIGGER attack). Following the attack heard several vicious depth charge barrages. Headed toward tanker on surface to draw off escorts. They saw us and two of them turned our way. They refused to stray very far from tanker. Repeated this maneuver several times."
  page: "7"
  flags: "TRIGGER's attack form: stern tubes fired at 1615 (I), 30-14 N 132-50 E; first hit heard two minutes later."
- date: "30 October"
  time: "1832"
  zone: "I"
  part: "I"
