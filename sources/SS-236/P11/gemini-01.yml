  zone: "I"
  part: "I"
  event: "Sighted aircraft, distance 10 miles. Manned all automatic weapons. Aircraft turned out to be a friendly Liberator, who provided welcome air cover and informed us his squadron had shot down another EMILY near our position in addition to one shot down yesterday near same spot."
  page: "9"
  flags: "TRIGGER's aircraft contact 28 (B-24s, own air cover), 1417 (I), was at 23-49 N 137-30 E."
