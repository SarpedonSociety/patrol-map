  page: "7"
- date: "30 October"
  time: "1910"
  zone: "I"
  part: "I"
  event: "Sighted tanker bearing ⟦242⟧ T."
  page: "7"
  flags: "Bearing read 242 (Qwen) / 212 (Bonsai). Check the scan."
- date: "30 October"
  time: "1924"
  zone: "I"
  part: "I"
  event: "Heard possible torpedoes running, bearing 140 T."
  page: "7"
- date: "30 October"
  time: "1950"
  zone: "I"
  part: "I"
