  zone: "I"
  part: "I"
  event: "Attempted to raise SAIPAN by radio to give rendezvous message. Could not contact on ⟦1555⟧. Finally passed message to NPM. Had not sent message sooner as did not want to open up. From the torpedo sightings, and planes sighted near us, the Nips had us spotted fairly well."
  page: "9"
  flags: "Time 1730 from Bonsai's read; Qwen has no time on this line. Frequency read [?155?] (Qwen) / 1555 (Bonsai). Check the scan."
