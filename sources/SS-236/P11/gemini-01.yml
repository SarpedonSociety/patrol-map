  event: "Sighted SALMON, TRIGGER and STERLET ahead. Stationed STERLET on port bow of SALMON and SILVERSIDES on starboard bow, TRIGGER scouting ahead of formation to report patrol boats. Mounted all automatic weapons, broke out extra ammunition to assist SALMON in repelling air attack."
