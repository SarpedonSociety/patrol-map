  zone: "I"
  part: "I"
  event: "Air coverage arrived. During day had as many as nine planes in sight providing air coverage. Also had air coverage at night."
  page: "9"
  flags: "TRIGGER's aircraft contact 29 (PB2Ys), 0803 (I), was at 20-01 N 139-56 E."
