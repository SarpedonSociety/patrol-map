Narrative (Part B), typed pages 1-9 of the report (scan files Page2-Page11 in the vault's 'Patrol 11' folder).
Not raw Gemini output. Claude put the OCR working transcription (Qwen3-VL 8B, checked against a second read by
Ternary Bonsai 27B; the vault note 'SS-236 Silversides - War Patrol 11 - OCR') into the narrative YAML the converter
reads on 2026-11-13, one event per typed entry. Where the two OCR reads differ in wording, the reading that forms the
word is used ('radar', not 'rader'); where they differ in a number, the PSO's hand reading from the scan is used if
he gave one, otherwise the number is in ⟦ ⟧ and flagged. Bonsai placed several entry times that Qwen ran into the
previous entry (19 Oct 0700 and 1950, 20 Oct 1906, 26 Oct 0400, 27 Oct 1109, 29 Oct 1303, 30 Oct 0757-0801); those
are used and flagged. Positions are entered only where the report gives one for the boat. Times: VW, K and L as typed
on the passage to Saipan; from 5-7 October 'All times henceforth will be (-)9, (Item), unless otherwise noted.'
Rendezvous tags are given to meetings in sight or alongside and to the first exchange with a boat outside the group;
the routine SJ and VHF exchanges with TRIGGER and SALMON are left untagged.

