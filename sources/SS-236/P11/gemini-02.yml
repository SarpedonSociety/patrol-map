Narrative of the Addendum (the second part of the patrol, the BURT'S BROOMS anti-patrol vessel sweep), typed pages
1A-7A of the report (scan files Page26-Page32). Not raw Gemini output: Claude's restructuring of the OCR working
transcription (Qwen3-VL 8B checked against Ternary Bonsai 27B) on 2026-11-13, on the same terms as gemini-01.yml.
The page numbers are typed '- 1A -' to '- 11A -'; the OCR reads them variously ('= 24 =', '- 34 -', '- 4i -',
'- 5A -', '6a', '- 74 -'). 'All times Item(-9), unless otherwise noted.'

