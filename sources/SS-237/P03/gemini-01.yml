    event: (5th Contact) (1st Attack) Lat. 35-45 N. Long. 140-55 E. 8400 ton freighter Sunk by Mines. Sighted a ship approaching from the southward heading almost exactly for this vessel. Ceased laying mines. Intended to permit this vessel to go by and then resume laying mines. Vessel was now identified as a large freighter with a small escort vessel inshore from it. They passed under our stern, this vessel on course 090 at that time. Position could have been perfect for a torpedo attack with stern tubes but considered completion of the mine plant as the immediate objective. A bit over five minutes after the freighter passed our stern, there was a violent explosion.
    page: 3
