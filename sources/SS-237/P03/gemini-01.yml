    event: (6th Contact) (2nd Attack) Lat. 34-52 N. Long. 139-49 E. 5000 ton freighter sunk. Sighted smoke up in URAGA SUIDO. As vessel approached, made it out to be a freighter zigzagging on about 60 degree legs. This vessel was in position to attack regardless of whether the destination of the target is north or southeast.
