    speed: 15 knots
    event: The freighter is 90 degrees from her former course lying in the trough of the seas rolling in the heavy swells violently while the escort vessel is circling her. An excellent view of the freighter was now had. Her back had been broken. Amidships the main deck was awash. About ten feet of the stern was above water and the bow was high out of water. The freighter sank rapidly. She had a raked bow, cruiser or counter stern, composite superstructure, flush deck except for a slight forecastle, one squat stack, masts, etc., not seen. Her appearance was similar to the following Marus: AIKOKU, KINRYU, HIROKAWA, KANSAI, KASII, CANBERRA, KYUSU, SADO, the average tonnage of which is 8400. She was making about 15 knots. The escort vessel appeared to be a motor torpedo boat. The presence of this escort, the first of the vessels sighted off INUBO SAKI with an escort, indicated the high value of the ship. Decided that there would probably be anti-submarine vessels in the vicinity at once so commenced retirement into deep water. We were in fifteen fathoms of water with a considerable distance to go before deep submergence would be possible.
    page: 3-4
