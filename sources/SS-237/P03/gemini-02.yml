    event: (8th Contact) (3rd Attack) Lat. 35-45 N. Long. 140-55 E. 5000 ton freighter Damaged or sunk by mines. The smoke had become four columns of smoke approaching INUBO SAKI. We were approaching for an attack south of INUBO SKI. At this instant, however, the leading ship, which had reached the exact bearing of our mine plants, commenced smoking at least five times as great as before and the three other ships scattered to the northward. The smoke off our mine plants lasted only a few minutes while the other three columns of smoke disappeared to the northward. Consider that a freighter of at least 5000 tons was damaged if not sunk by this mine.
    page: 6
