    event: (10th Contact) (4th Attack) Lat. 34-29 N. Long. 140-38 E. 8500 ton freighter Sunk. Sighted large vessel on a southeasterly course. Commenced approach. The seas had picked up late this afternoon and were now mountainous. Even with 10 feet of periscope out the seas spilled over the sight and the target could be seen only momentarily. Depth control was precarious. Use of high speed, trimming heavy and the excellent performance of duty of the planesmen and the Diving Officer, Lieutenant S. H. GIMBER, U.S.N., were the only reasons why and undetected attack was at all possible. The target was large and zigzagging on courses about 60 degrees apart. She had a cargo of planes on her stern.
    page: 7
