    bearing_is: 
    tag: attack
    course: 
    speed: 
    event: Fired speed spread of 3 torpedoes at range of 1500 yards 90 port track. Two hits; one hit just under the well deck which folded the forecastle up at an angle of about 45 degrees, and one hit about one-fourth ship's length inside the stern. As soon as we fired we turned at high speed to bring the stern tubes to bear, only one torpedo remaining forward. At this time at least three dozen fishing vessels of various types could be seen approaching the destroyer from shore. The destroyer in the meantime was sinking on an even keel with steam and smoke issuing from her.
    page: 10-11
    flags: entry continues onto page 11; "nits" and "firoc" typed in source
