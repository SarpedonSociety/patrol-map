    event: (13th Contact) (5th Attack) Lat. 35-02 N. Long. 140-12 E. Minekaze Class Destroyer Sunk. Sighted a vessel of unknown type bows on. Commenced approach. She was zigzagging and on the next zig showed herself as a forward welldeck destroyer.
    page: 10
    flags:
