    title: Steering gear box repaired
    part: I
    charges: 
    damage: 
    course: 
    speed: 
    event: "The storms having abated for a few hours, effected repairs. These repairs were made by Lieutenant R.S. Garvey, U.S.N.R. and Floyd C. Standlee, MoMM 2c, U.S.N. In their location, while so engaged, it would have taken several minutes to have gotten them inside the ship. Their intrepidity as well as skill are hereby cited. Their investigation revealed that, when steering from the bridge was removed during the last refit, two ball bearings, dropped into the bottom of the gear box and were not removed. These worked into the gears and caused jamming. Repairs were apparently a success."
    page: 2
