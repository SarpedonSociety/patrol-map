    title: Bow attack on Q-ship
    part: I
    charges: 
    damage: 
    course: 
    speed: 
    event: "Fired 3 bow torpedoes at 1900 yard range 110 port track. The first torpedo, which, if the problem was worked out correctly, should have hit, prematured in 15 seconds. The other two should have missed due to spread and did miss. The target turned toward us. Put up the periscope to give him a good point of aim and headed for him. Had only one torpedo ready forward because we try, normally, with only one old target, to save two dry torpedoes forward for the \"coup de grace\"."
    page: 6
    flags: ""
  - date: May 29
    time: 1729
    zone: K
    lat: 
    lon: 
    from: 
    bearing: 
    distance: 
    bearing_is: 
    tag: attack
    title: Down the throat shot and counterattack
    part: I
    charges: about 20
    damage: 
    course: 
    speed: full speed
    event: "Fired one torpedo dead ahead zero angle on the bow torpedo run 800 yards, depth 15 feet (to avoid another premature though the sea was not rough). No detonation. Went deep at full speed and as much rudder as depth gaining could permit. As soon as we had gotten 60 degrees off the course shifted the rudder to pull the stern off the track. The first string of depth charges were beauties. A severe depth charging was the price we paid for this attack. If we could do it over again would have had more torpedoes ready and on the down the throat shot would have given him two at 15 feet and the last at zero foot depth to deliberately premature in his face. Might have blown his bow off. He had sound gear but did not ping. He was no amateur but made several runs and listened, just like a destroyer. He dropped about 20 charges in all."
    page: 6
    flags: "also counterattack"
