    tag: notable
    title: Near collision with destroyer
    part: I
    charges: 
    damage: 
    course: 
    speed: 
    event: "After one of several ten minute full speed runs in order to keep the true bearing from changing, put up the usual 8 feet of periscope and, fortunately, took first a quick look around in low power, for there was a destroyer with about zero angle on the bow, range about 2000 yards, all bow wave; probably about 25 knots. Sound had especially listened all around during the slow down and nothing had been heard. Naturally no tubes were ready. Made them ready at once but could not get a reasonable set up for a shot. Did not go deep though should have because all he had had to do was start dropping and we would have been badly off. The destroyer passed us us at about 200 yards range. She looked like the new Japanese type shown in the January 13, 1943 issue of \"O.N.I. WEEKLY\", similar to the USS ANDERSON."
    page: 3
