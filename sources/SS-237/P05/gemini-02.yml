    title: Attack on large aircraft carrier
    part: I
    charges: 
    damage: 
    course: 
    speed: 
    event: "Fired 6 bow torpedoes at initial range of 1200 yards mean track 75 starboard using speed spread of 1 knot increments. At the time of firing we were inside the near screen, this vessel being at the moment on our port beam distance about 2000 yards, angle on the bow 30 port. By the time the hits started coming in which was just as the 6th fish was fired the angle on the bow of the nearest DD was almost zero. No time to turn to fire the stern anywhere. Went deep and stood by heading for the carrier. The target's screws had slowed and then stopped. Continued to head toward the target in order to confuse the depth chargers. We did not, however, have to wait long for their co-ordinated attacks, and they were excellent. As usual they alternated making runs and never wasted a charge."
