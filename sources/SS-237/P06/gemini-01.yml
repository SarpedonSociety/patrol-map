    tag: attack
    title: "ATTACK #5 TANKER, 7300 TONS MISSED"
    part: I
    charges: 
    damage: 
    with: 
    course: 
    speed: 
    event: "During this time we were swinging hard left. Bridge saw FREIGHTER #3 turn away. FREIGHTER #1 was holding on her original course. Both remaining freighters and tankers opened fire. Range was about 1000 yards to the tanker column, 2000 yards to the freighter column. It was so bright they had no difficulty seeing us. Splashes were seen on both sides of us, but not too close. TANKER #3 presented a 50 starboard angle on the bow, and was closing rapidly, firing his bow gun. We seemed to take a year to pick up speed. Finally steadied with our stern toward him, and at fired three torpedoes aft at this tanker, 50 S track, GA 0, 1000 yards. All missed, probably because we had not steadied enough, and he was swinging toward us, as we realized in a moment."
    page: 7
    flags: "Text preceding fired three torpedoes leads directly into Attack 5 at 2100 I"
