    tag: attack
    title: "ATTACK NO. 1 - 8500 TON FREIGHTER - TWO DUDS"
    part: I
    charges: 
    damage: 
    with: 
    course: 
    speed: 
    event: "Fired four torpedoes, 80 starboard track, 1100 yards, GA 15 L. At time of firing had TBT bearings, periscope bearings, SJ bearings and ranges, all checking. Two hits seen from the bridge, both duds. Nothing heard below decks. No doubt about the hits the first was aft of the midship superstructure, and the second was on the bow. Immediately afterward, flashlights were seen on deck and over the side at the points where the torpedoes hit. The target swung towards to ram and we went to full speed and swung away. Lights all over his decks by this time."
    page: 3
