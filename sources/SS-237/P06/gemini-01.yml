    with: 
    course: 
    speed: 
    event: "Fired last two torpedoes, 90 port track, GA 0, 1000 yards. One hit, one missed, according to sound. No detonation, but target evidently felt the hit, for he opened fire immediately. The feelings of the Commanding Officer and the control party by this time can be imagined. Held huddle over a battle surface, decided against it, because our three inch deck gun has never in its history fired five consecutive shots without jamming. We felt, under the circumstances, that our chances in a gun fight against a fully aroused enemy were not of the best, and that the probability of the target's sinking eventually was still good."
    page: 10
