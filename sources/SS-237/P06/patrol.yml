# Torpedo attack results for the map marker (README, "Attack results").
# hit = at least one torpedo exploded against the target; miss = none
# (misses, duds, prematures). Keys are the ids on the detail cards.
results:
  A13: miss   # p.24 attack 1: "Two hits Two misses"; Remarks "Both hits were duds."
  A14: hit    # pp.25-26 attack 2: "Two hits - - - two misses"; "One hit was a dud."; saw ship sink
  A15: hit    # pp.27-28 attack 3: "Two hits"; "Saw ship blow up."
  A16: hit    # pp.29-30 attack 4: "Two hits"; "Saw tanker catch on fire and later blow up."
  A17: miss   # pp.31-32 attack 5: "No hits"
  A18: hit    # pp.33-34 attack 6: "Hit"; "Saw target hit. Saw target sink."
  A19: hit    # pp.35-36 attack 7: "Two hits"; "Saw two hits in bow."
  A20: miss   # pp.37-38 attack 8: "One miss, one dud"; "No results."
  A21: miss   # pp.39-40 attack 9: "One miss, one dud"; "No results."

# Pages 10-11 (22 September), put back from the scan. Gemini summarized the
# 0036 entry, gave the two paragraphs that continue it on page 11 as a
# separate summary timed 0045, timed "Set course" 0050, left out the 0050
# entry and summarized 0055. The page reads 0045 Set course, 0050 Sighted a
# glow, 0055 The glow flared up.
events:
- replaces:
    date: September 22, 1943
    time: '0036'
  date: September 22, 1943
  time: '0036'
  zone: I
  part: I
  event: 'Surfaced. Three radar contacts. Burning TANKER # 1, damaged FREIGHTER # 3, and undamaged FREIGHTER # 1. The latter was slowly steaming back and forth near the fire, like a moth drawn to a flame. FREIGHTER # 3 was still firing aimlessly, forcastle awash, but able to make 4 knots. The whole action covered a period of 3 1/2 hours, and took place within a circle of 8000 yards of the burning NIPPON MARU. The light cast by this fire was intense; the flames being, most of the time, a hundred feet over the tops of his masts. Continuous minor explosions took place, throwing up gobules of fire even higher. The smoke emitted covered a third of the sky, and was blown by the wind into a plume twenty miles long. It must be admitted that the light of the fire was probably of more benefit to us than to the enemy, however, since we were always able to get around to the dark side and use it to our advantage.'
  page: 10-11
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026: the entry runs on from page 10 into two untimed paragraphs at the head of page 11 (from ''The whole action''). ''Burning'' and ''damaged'' have broken letters on the scan; ''forcastle'' and ''gobules'' as typed. Check against the pages.'
- replaces:
    date: September 22, 1943
    time: '0045'
  date: September 22, 1943
  time: '0045'
  zone: I
  part: I
  event: Set course for edge of area, full speed on all engines.
  page: 11
  flags: 'Time read 0045 from the scan (Gemini had this entry at 0050, and a summary of the page''s opening paragraphs at 0045). Read by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 22, 1943
    time: '0050'
  date: September 22, 1943
  time: '0050'
  zone: I
  part: I
  event: Sighted a glow over the horizon, beyond the burning tanker.
  page: 11
  flags: 'Entry left out by Gemini, which had ''Set course'' at this time. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 22, 1943
    time: '0055'
  date: September 22, 1943
  time: '0055'
  zone: I
  part: I
  event: 'The glow flared up, and burst into brilliant flame, identical to that of the burning tanker. It was TANKER # 2, as she blew up. By 0100 I, two huge fires could be seen. The bow, bridge, and stern of the distant tanker were incandescent. Nothing more could be seen of the hull of the NIPPON MARU, but the place where she had been was still burning fiercely, with flames 50 to 100 feet high. Allowed members of the crew, one at a time, to come up on the bridge to see the two burning ships.'
  page: 11
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'

