# USS Trigger (SS-237), War Patrol 6
# Transcribed by Gemini in three fresh chats: gemini-01.yml (narrative,
# pages 1-12), contacts-01.md (ship and aircraft contacts, pages 21-22)
# and attacks-01.md (TORPEDO ATTACK DATA forms, pages 24-40, verbatim).
# Hand entries here take precedence.

boat: SS-237
patrol: 6
year: 1943
report_found: yes
report:
comsubpac_report_no: 279
commanding_officer:

arrival:
  port: Midway
  date: September 30, 1943
  page: 12
  flags: "Report: 'Arrived Midway.' No time given."

period:
  start: 1943-09-01
  end: 1943-09-30
  source: "Patrol report"

# Claimed tonnage from the TORPEDO ATTACK DATA forms (attacks-01.md). Times GCT.
# Attack 1 (17 Sept, two duds) was the same freighter that attack 2 sank.
tonnage:
  - { date: Sept. 17, 1943, time: "1523", zone: Z, target: Freighter (GOSYO MARU type), result: sunk, tons: 8500, basis: claimed, source: "Attack 2, page 25" }
  - { date: Sept. 21, 1943, time: "1156", zone: Z, target: Tanker (NIPPON MARU type), result: sunk, tons: 10000, basis: claimed, source: "Attack 3, page 27" }
  - { date: Sept. 21, 1943, time: "1157", zone: Z, target: Tanker (SYOYO MARU type), result: sunk, tons: 7500, basis: claimed, source: "Attack 4, page 29" }
  - { date: Sept. 21, 1943, time: "1157", zone: Z, target: Freighter (ARGUN MARU type), result: sunk, tons: 6700, basis: claimed, source: "Attack 4, page 29: second freighter in far column" }
  - { date: Sept. 21, 1943, time: "1201", zone: Z, target: Tanker (SAN PEDRO MARU type), result: sunk, tons: 7300, basis: claimed, source: "Attack 6, page 33 (missed by attack 5)" }
  - { date: Sept. 21, 1943, time: "1312", zone: Z, target: Freighter (LIMA MARU type), result: damaged, tons: 7000, basis: claimed, source: "Attack 7, page 35; attacks 8 and 9 on the same ship, duds" }

# Drawings in the report, shown in a lightbox from the detail card.
# Images are crops of the Fold3 download in media/SS-237/P06/.
figures:
  - id: attack-sketch
    title: Sketch of the convoy attacks, 21 September 1943
    page: 8
    attacks: [3, 4, 5, 6, 7, 8, 9]
    image: media/SS-237/P06/attack-sketch.jpg
    cleaned: media/SS-237/P06/attack-sketch-cleaned.jpg
    thumb: media/SS-237/P06/attack-sketch-thumb.jpg
    caption: >-
      Hand-drawn in the narrative, Enclosure (A) page 8. Trigger's numbered
      positions for attacks 3 to 9, the torpedo tracks, and the fate of each
      ship as the report saw it. Not to scale.

# Torpedo attack results for the map marker (README, "Attack results").
# hit = at least one torpedo exploded against the target; miss = none
# (misses, duds, prematures). Keys are the ids on the detail cards.
results:
  A13: miss   # p.24 attack 1: "Two hits Two misses"; Remarks "Both hits were duds."
  A14: hit    # pp.25-26 attack 2: "Two hits - - - two misses"; "One hit was a dud."; saw ship sink
  A15: hit    # pp.27-28 attack 3: "Two hits"; "Saw ship blow up."
  A16: hit    # pp.29-30 attack 4: "Two hits"; "Saw tanker catch on fire and later blow up."
  A17: miss   # pp.31-32 attack 5: "No hits"
  A18: hit    # pp.33-34 attack 6: "Hit"; "Saw target hit. Saw target sink."
  A19: hit    # pp.35-36 attack 7: "Two hits"; "Saw two hits in bow."
  A20: miss   # pp.37-38 attack 8: "One miss, one dud"; "No results."
  A21: miss   # pp.39-40 attack 9: "One miss, one dud"; "No results."
