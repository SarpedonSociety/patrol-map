    time: '1545'
  date: September 21, 1943
  time: '1545'
  zone: 'I'
  part: 'I'
  course: '030 T to 130°T'
  speed: 'eight'
  page: '5'
  event: 'Convoy in sight, consisting of one very large tanker, two smaller tankers, and three old type freighters, with air coverage. Full speed since sighting, unable to close. Barring a radical and wholly illogical zig, our only hope is a night attack. Convoy is zigzagging from 030°T to 130°T, speed eight.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '1600'
  date: September 21, 1943
  time: '1600'
  zone: 'I'
  part: 'I'
  page: '5'
  event: 'Ships identified as follows: The largest tanker is similar to NIPPON MARU, page 263, except that she mounts tripod masts forward and aft, and raised gun mounts, bow and stern. Also, from all experience this vessel has had, she is larger than the standard new type Japanese tanker of 10,000 tons. Not a whale factory, however. Other two tankers similar to SYOYO MARU and SAN PEDRO MARU, pages 273 and 275 respectively. Freighters are: LIMA MARU, page 227, ARGUN MARU, page 230 and KOHUKU MARU, page 106. All pages in ONI 208-J. Truly an ill-assorted bunch.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. The colons after ''as follows'' and ''Freighters are'' may be typed as semicolons. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2030'
  date: September 21, 1943
  time: '2030'
  zone: 'I'
  part: 'I'
  course: '080 T'
  speed: '8'
  page: '6'
  event: 'On starboard beam of the convoy, range 8000. Plot indicates course 080° T, speed 8, not zigzagging. Disposition from PPI - Two columns of three ships each, 1000 yards apart. From the size and location of the pips, decided the tankers are on our side, hence will attack this side. Waited till it became a little darker.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2057-10'
  date: September 21, 1943
  time: '2057-10'
  zone: 'I'
  part: 'I'
  page: '6'
  event: 'One hit seen on after part of the TANKER # 1. Flame shot five hundred feet into the air, lighting up the whole area as bright as day. All six ships could plainly be seen. Eight seconds later the second torpedo hit her amidships, but nothing could have added to the furious holocaust already taking place. Members of her crew in various stages of dress (most in white uniforms) could be seen running forward ahead of the rapidly spreading flames. She was still driving ahead, a brilliant blazing funeral pyre. The men in the bow manned the bow gun and fired three or four times, but she was soon burning throughout her length. The flames were yellow-red, evidently a gasoline fire.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2058-50'
  date: September 21, 1943
  time: '2058-50'
  zone: 'I'
  part: 'I'
  page: '7'
  event: 'One hit amidships on FREIGHTER # 2 in the far column. In the light of the burning tanker she was seen to break in half beneath the stack and sink immediately. Radar was on this target at the time, the operator having expressed a desire to see a ship sink on his screen. His wish was fulfilled, for on both the radar and PPI screens the pip was seen to diminish and finally disappear. Radar and PPI then indicated five targets.'
  flags: 'Time typed as 2056-50 I in text; chronological sequence indicates 2058-50 I. Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. The 8 in 2058 is broken on the scan and looks like a 6, as it does in the 2058-10 entry above it. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2102'
  date: September 21, 1943
  time: '2102'
  zone: 'I'
  part: 'I'
  page: '7-8'
  event: 'Dived. Slight confusion in the conning tower. The Commanding Officer fell into the periscope well and the quartermaster began to lower the periscope. Fortunately the Commanding Officer, supporting himself on his elbows, was able to make himself heard in time. In the meantime, with lots of down angle and lots of speed, went to 200 feet, figuring TANKER # 3 might try to ram or possibly drop some depth charges as he passed over. However, he did not pass over, and in fact, no screws were heard. The situation at this time can best be illustrated by the following sketch:'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Runs on from page 7 into the untimed paragraph at the head of page 8, which introduces the sketch. The sketch and its typed note are not transcribed here (see figures). Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2120'
  date: September 21, 1943
  time: '2120'
  zone: 'I'
  part: 'I'
  page: '9'
  event: 'Periscope depth. Burning ship still very bright, but nothing else could be seen. Made reload, two torpedoes left forward, four aft. Took periscope pictures and allowed crew to view burning tanker through both periscopes.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2141'
  date: September 21, 1943
  time: '2141'
  zone: 'I'
  part: 'I'
  page: '9'
  event: 'Surfaced. Took more pictures of burning ship. Radar and PPI reported five contacts, three in the vicinity of the burning tanker, and two others. The situation as clarified by plot and PPI was as follows: TANKER # 1, stopped, burning. TANKER # 2, burning, course east. TANKER # 3, down by bow. FREIGHTER # 1, undamaged, stopped near burning ship. FREIGHTER # 2, sunk. FREIGHTER # 3, undamaged, course north.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. The colon after ''as follows'' may be typed as a semicolon. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2142'
  date: September 21, 1943
  time: '2142'
  zone: 'I'
  part: 'I'
  page: '9'
  event: 'Took off after ship moving north. As we passed the burning NIPPON MARU abeam, the stern of a ship, pointing vertically into the air, drifted between us and was distinctly silhouetted. It is believed that this was the stern of TANKER # 3, but it is possible it was the stern of FREIGHTER # 2. However, this freighter already had been seen to sink at about 2059.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2220'
  date: September 21, 1943
  time: '2220'
  zone: 'I'
  part: 'I'
  page: '9'
  event: 'FREIGHTER # 3 down to his main deck forward, dead in the water, but still not under. Decided to polish him off, and made surface approach. He was still firing but evidently to wrong side, because we could see no flashes. FREIGHTER # 1, several thousand yards beyond him, was shooting back. Score zero for both, as far as we could see.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
- replaces:
    date: September 21, 1943
    time: '2332'
  date: September 21, 1943
  time: '2332'
  zone: 'I'
  part: 'I'
  page: '10'
  event: 'Surfaced. Found ourselves silhouetted against burning TANKER # 1. Went to full speed, pulled around FREIGHTER # 3 on the dark side. Passed too close (2500 yards). Target saw us and opened fire.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Check against the page.'
