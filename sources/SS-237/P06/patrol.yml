  date: September 18, 1943
  time: '0029'
  zone: 'I'
  part: 'I'
  page: '4'
  event: 'Made battle surface. Nothing in sight. No wreckage, no Japs. They never knew what had happened. Have heard of targets sinking fast, but this is the first time this ship or the Commanding Officer has ever experienced such a thing. It seemed very unreal. The ship was similar to the GOSYO MARU, of 8500 tons, page 49, ONI 208-J.'
  flags: 'Gemini gave this entry as a summary. Read from the scan by Claude, 14 Nov 2026. Includes the untimed paragraph that follows the entry (''Have heard of targets sinking fast''). Check against the page.'
