# USS Trigger (SS-237), War Patrol 7
# Transcribed by Gemini, one PDF per fresh chat: gemini-01.yml (narrative,
# pages 1-4), gemini-02.yml (pages 5-11), contacts-01.md (ship and aircraft
# contacts, pages 19-20) and attacks-01.md (seven TORPEDO ATTACK REPORT
# FORMs, pages 14-20). Hand entries here take precedence.
# Midway to the East China and Yellow Seas, then Midway (3 December) and
# Pearl Harbor (8 December). Narrative times are zone I (-9) after the run
# out (Y at Midway, K on 30 October); the contact tables are in GCT (Z) and
# agree with the narrative throughout once converted.

boat: SS-237
patrol: 7
year: 1943
report_found: yes
report: "Report of Seventh War Patrol."
comsubpac_report_no: 323
commanding_officer: "R. E. Dornin"

# Report totals (pages 11-12, from Matt's index note). Four legs: the report
# adds Midway to Pearl after the run home to Midway. Fuel: 34,595 gallons
# received at Midway. The printed fuel total, 112,090, is 10,000 more than
# the four legs (102,090): an addition error in the report.
miles_steamed: { to_area: 2912, in_area: 2275, area_to_base: 2920, midway_to_pearl: 1268, total: 9375 }
fuel_expended: { to_area: 32890, in_area: 17430, area_to_base: 33470, midway_to_pearl: 18300, total: 112090 }

# A zone letter typed as the numeral 1 (6 November 0602) is zone I.
zone_fix: { "1": I }

departure:
  port: Midway
  date: October 22, 1943
  time: "1500"
  zone: Y
  page: 1

arrival:
  port: Pearl Harbor
  date: December 8, 1943
  page: 11
  flags: "Arrived Midway 3 December, then Pearl Harbor 8 December. No times given."

period:
  start: 1943-10-22
  end: 1943-12-08
  source: "Patrol report"

# Claims are on the attack forms (attacks 1, 3, 4, 6, 7); credits not yet entered.
tonnage: []

events:
  # The run out, typed "October 22 - 30" as one heading.
  - replaces: { date: "October 22 30", page: 1 }
    date: October 22, 1943
    part: I
    event: "Conducted training exercises enroute."
    page: 1
    flags: "Heading typed as a span, 22 to 30 October; placed on 22 October."
  # Page 7 is headed November 9, with '13' typed below it: entering the area
  # is 9 November, the convoy and the sixth attack are 13 November. The
  # contact tables agree (ship contact 5, 1800 Z 12 Nov = 0300 I 13 Nov;
  # aircraft contact 6, 2340 Z 12 Nov = 0840 I 13 Nov; attack form 6,
  # 0555 I 13 November). Gemini dated these entries 9 November.
  - replaces: { date: "November 9", time: "0300" }
    date: November 13
    time: "0300"
    zone: I
    lat: "33-05 N."
    lon: "125-13 E."
    part: I
    event: "Sighted smoke of several ships. Because of extraordinarily bright moonlight, could not close to radar range."
    page: 7
    flags: "Date 13 November from the '13' below the page 7 heading and the contact tables (Gemini: 9 November). Heading: FIFTH CONTACT / 9 SHIP CONVOY WITH 4 ESCORTS."
  - replaces: { date: "November 9", time: "0415" }
    date: November 13
    time: "0415"
    zone: I
    part: I
    event: "[SUMMARY] Tracked by TBT and visual estimates; convoy base course 250° T, zig-zagging 210 to 290, speed 8. Total about 12 ships with 3-4 escorts."
    page: 7
    flags: "Date 13 November (Gemini: 9 November); see the 0300 entry."
  - replaces: { date: "November 9", time: "0459" }
    date: November 13
    time: "0459"
    zone: I
    part: I
    event: "In position ahead of convoy, estimated range 11,000 yards."
    page: 7
    flags: "Date 13 November (Gemini: 9 November); see the 0300 entry."
  - replaces: { date: "November 9", time: "0515" }
    date: November 13
    time: "0515"
    zone: I
    part: I
    event: "Dived. Still unable to get radar ranges. Target in sight through periscope, went to 60 feet."
    page: 7
    flags: "Date 13 November (Gemini: 9 November); see the 0300 entry."
  - replaces: { date: "November 9", time: "0535" }
    date: November 13
    time: "0535"
    zone: I
    lat: "32-57 N."
    lon: "125-06 E."
    part: I
    event: "[SUMMARY] Moonlight periscope approach heading for convoy center. Passed between MOMI-class destroyer screen. One destroyer made knuckle at 700 yards, echo-ranged, but continued on."
    page: 7
    flags: "Date 13 November (Gemini: 9 November); see the 0300 entry. Heading: SIXTH ATTACK / 10,000 TON TRANSPORT, SUNK."
  - replaces: { date: "November 9", time: "0545" }
    date: November 13
    time: "0545"
    zone: I
    part: I
    event: "[SUMMARY] Convoy zigged towards us. Three ships passed 700 yards ahead. Swung left full speed to target largest ship with stern tubes."
    page: 7
    flags: "Date 13 November (Gemini: 9 November); see the 0300 entry."
