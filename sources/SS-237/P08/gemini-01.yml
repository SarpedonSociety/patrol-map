    event: "Fired three torpedoes at the DD, range 700 yards, 90 port track, gyro angle zero. Total divergent spread 10°. (ATTACK 1-B). Swung right with full rudder and full speed. The quickness with which this situation developed was such that there was no time to do anything but shoot, shift targets, and shoot again. The six torpedoes were fired practically as one continuous salvo. Although it had been intended to shoot first at the last AP, the radar got on the far DD instead."
