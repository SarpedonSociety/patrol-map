  event: "Received message from escorts that plane was down 58 miles, bearing 252 from reference point. Sent TRIGGER serial one to COMSUBPAC, info TANG of this fact. Weather very hazy over FORMOSA and few planes seen. Business was very slack all day except for several Jap plane approaches to 8 miles and usual friendly plane approaches without IFF."
  page: "7"
  flags: "The position is the downed plane's, from a reference point the report does not give."
