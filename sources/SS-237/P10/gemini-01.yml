Narrative (Part B) of the first part of the patrol, typed pages 1-20 of the report (scan files WP10.2-WP10.21 in the
vault's 'Patrol 10' folder; the scan number is the typed page number plus one). Not raw Gemini output. Claude put the
OCR working transcription (Qwen3-VL 8B, checked against a second read by Ternary Bonsai 27B; the vault note 'SS-237
Trigger - War Patrol 10 - OCR') into the narrative YAML the converter reads on 2026-11-13, one event per typed entry.
Where the two OCR reads differ in wording, the reading that forms the word is used ('looks', not 'locks'); where they
differ in a number, the PSO's hand reading from the scan is used if he gave one, otherwise the number is in ⟦ ⟧ and
flagged. Positions are entered only where the report gives one for the boat; the positions typed under the SHIP
CONTACT headings are the contact table's, and stay in the text. Times: VW, Y, M and L as typed on the passage to
SAIPAN; (I) from 4 October to the end. Rendezvous tags are given to meetings in sight or alongside and to the first
exchange with a boat outside the group; the routine SJ and VHF exchanges with SILVERSIDES and SALMON are left
untagged. Part (J), the anti-submarine measures, gives the 30 October depth charging as one Part VIII entry.

