- date: "26 October"
  time: "0836"
  zone: "I"
  part: "I"
  event: "SHIP CONTACT #7. NOT ATTACKED. TWO SHIPS - HEAVY TOPS - SEVERAL LIGHT TOPS. LAT. ⟦24-97⟧ N LONG. 125-41 E. Sighted tops of heavy ship bearing 060°T through high periscope, estimated range 25 miles. Commenced maneuvering for end around keeping range, such that we would not be sighted. Almost immediately the tops of another heavy ship and 2 smaller tops were seen. The task force was plotting on course 040°T, speed 16 kts., and the possibility of a long end around looked good at this time. Continued maneuvering to get to eastward of task force while clearing contact report to SILVERSIDES and SALMON on wolfpack frequency. (Ending around to East had three advantages: (1) It placed task force between us, SILVERSIDES, and SALMON; (2) Put task force between us and mine field, and; (3) Ending around to West would put us in sight of MIYOKA JIMA before we could get ahead). Asked them to retransmit to COMSUBPAC for us. APR indications were strong on 210, 197, and 147 megs (See comment on Radar), and one plane (PLANE CONTACT #25) was seen over the task force."
  page: "13"
  flags: "The heading's latitude reads 24-97 (Qwen) / 24-57 (Bonsai); the contact table (contact 7) and aircraft contact 25 have 24-07 N 125-41 E (PSO). Runs onto page 14 ('0836 (I) Cont'd.'). MIYOKA as read (MIYAKO is meant)."
- date: "26 October"
  time: "0830"
  zone: "I"
  part: "I"
  event: "Message sent and receipted for by U.S.S. SALMON and U.S.S. SILVERSIDES. The bearing had been drawing steadily to the left and it appeared we were doing all right on our end around. True bearing was then 010°T."
  page: "14"
  flags: "Time 0830 as read in both reads, after the 0836 entry and before 0905: probably 0850 typed or read as 0830. Check the scan. 'receipted' (Bonsai); Qwen read 'received'."
- date: "26 October"
  time: "0905"
  zone: "I"
  part: "I"
  event: "Range commenced to open rapidly with task force bearing 005°T. Closed on true bearing."
  page: "14"
- date: "26 October"
  time: "0912"
  zone: "I"
  part: "I"
  event: "True bearing 003°T with target tops just visible and getting smaller. That feeling of utter frustration that we know so well is here again."
  page: "14"
- date: "26 October"
  time: "0925"
  zone: "I"
