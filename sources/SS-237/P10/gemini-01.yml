- date: "27 October"
  time: "0610"
  zone: "I"
  part: "I"
  event: "Submerged at sunrise and commenced closing to investigate. Plotting and TDC showed them on course 240°T, speed 2 kts. Periscope now revealed they were under sail. Let them go because of close proximity to land, and planned to look them up after dark."
  page: "15"
- date: "27 October"
  time: "0627"
  zone: "I"
  part: "I"
  event: "c/c to 120°T having decided to look into ISHIGAKI HAKUCHI for anchored ships. IRIOMOTE JIMA then bore 140°T."
  page: "15"
- date: "27 October"
