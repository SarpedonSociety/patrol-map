- date: "19 October"
  time: "1005"
  zone: "I"
  part: "I"
  event: "SHIP CONTACT #4. NOT ATTACKED. SHIGURE CLASS DESTROYER. LAT. 25-20N LONG. 122-37E. Sighted mast (SHIP CONTACT #4) range 10,000 yards, bearing 065°T. Battle stations submerged. As his tops came in sight saw he had a large port angle on the bow so changed course to 320°T and went ahead standard to close the track. He tracked at 15 kts., base course 255°T, constant helming, and was a big fat unescorted SHIGURE class DD, apparently heading for KURUN KO."
  page: "9"
  flags: "The heading's position is the contact table's (contact 4). The contact table dates contacts 4 and 5 10-18-44; the narrative, SILVERSIDES' report (TRIGGER's message received 1950 (I), 19 October) and the 1st endorsement put them on 19 October."
- date: "19 October"
  time: "1027"
  zone: "I"
  part: "I"
  event: "Range had decreased to 5600 yds., and we were on a normal approach course losing bearing fast when he zigged right again and left us. At this time, several pings were heard, but he had not slowed so it was probably his fathometer. Range continued to open fast and at"
  page: "9"
- date: "19 October"
  time: "1108"
  zone: "I"
  part: "I"
  event: "watched him go out of sight on the horizon on course 255°T, bearing 247°T, still heading for KURUN KO. Believed he might be an advance scout for something big coming later so determined not to be caught in the same spot twice, and took up patrol station along 25°-10° N after sending contact report over wolfpack frequency to SILVERSIDES and SALMON."
  page: "10"
- date: "19 October"
  time: "1328"
  zone: "I"
  part: "I"
  event: "SHIP CONTACT #5. NOT ATTACKED. 2 ATAGO CA'S, 1 NATORI CL, 2 DD LEADERS or CLs, SEVERAL FUBUKI DD's. LAT. 25-15 N LONG. 122-48 E. Sighted tops of several ships bearing 080°T, range 18,000 yds. Went to battle stations and commenced approach."
  page: "10"
  flags: "The heading's position is the contact table's (contact 5)."
- date: "19 October"
  time: "1332"
  zone: "I"
  part: "I"
  event: "Sighted float type plane (PLANE CONTACT #17) circling ahead of convoy. c/c to 340°T, estimated range 16,000 yds., angle on bow 10° stbd. Course of 340°T was taken as it was believed task force would zig north just as DD had."
  page: "10"
  flags: "The aircraft table types contact 17 at 1232 (PSO, from the scan): the report disagrees with itself."
- date: "19 October"
  time: "1334"
  zone: "I"
  part: "I"
  event: "Angle on bow 30 Port; all ahead standard."
  page: "10"
- date: "19 October"
  time: "1337"
  zone: "I"
  part: "I"
  event: "Angle on bow 60 Port and following ships were identified: 2 ATAGO class cruisers, 1 light cruiser and possibly 2 other light cruisers or destroyer leaders, and several FUBUKI class destroyers. (This is an estimate as only the tops of the superstructure were seen.) Took normal approach course."
  page: "10"
- date: "19 October"
  time: "1342"
  zone: "I"
  part: "I"
  event: "Angle on bow 0, range 10,000 yds."
  page: "10"
- date: "19 October"
  time: "1344"
  zone: "I"
  tag: "counterattack"
  title: "Torpedo from the task force's float plane"
  part: "I"
  event: "Plane was sighted 3,000 yds., angle on bow zero. Went to 70 feet between looks. Torpedo was heard passing along stbd. side. All stop."
  page: "10"
  flags: "Qwen read 'locks', Bonsai 'looks'. Part J: 'the float plane over the Task Force on 18 October sighted and fired a torpedo at us' (dated the 18th, as the contact table)."
- date: "19 October"
  time: "1345"
  zone: "I"
  part: "I"
  event: "Convoy was heard to zig right on sound gear and upon looking, we had 60 port angle on bow. From this time on, we lost bearing fast and range opened although we continued at standard speed on normal approach course."
  page: "10"
  flags: "Time read '1345-3C' (Qwen): a time span or a struck figure; check the scan. Qwen read 'locking'."
- date: "19 October"
  time: "1449"
  zone: "I"
  part: "I"
  event: "Task Force disappeared on horizon on course 270°T, bearing 300°T. Apparently, we were sighted at 1342 by the plane. If we could have made 15 kts. submerged or had had a 10,000 yd. torpedo, we might have made it. To have 2 approaches in one day with such valuable ships get by, and not to be able to get within firing range even when we guessed his base course and zig plan, was discouraging to say the least however, at"
  page: "10"
- date: "19 October"
  time: "1522"
  zone: "I"
  part: "I"
  event: "surfaced on course 245°T on 3 main engines, and sent contact report to COMSUBPAC, info Third Fleet; thereby carrying out orders to get contact report off of any enemy task forces encountered (i.e., report first, then attack). Tried to raise SILVERSIDES or SALMON, without results."
  page: "10"
  flags: "Runs onto page 11, where the continuation is headed '1552 (I) Cont'd.' (Qwen; check the scan)."
