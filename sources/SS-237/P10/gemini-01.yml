  event: "Received contact report from SALMON - c/c to 158°T at full speed to intercept."
  page: "16"
- date: "30 October"
  time: "0700"
  zone: "I"
  part: "I"
  event: "Received message from SALMON giving ⟦07C0⟧ enemy position and stating she was making end around. Results negative."
  page: "16"
  flags: "A struck figure, read '07C0' (Qwen) / '07C[?°?]' (Bonsai): probably 0700."
- date: "30 October"
  time: "0710"
  zone: "I"
  part: "I"
  event: "SHIP CONTACT #9. ONE DAMAGED. ONE LARGE CONVERTED TANKER, FOUR ESCORTS. LAT. 29-29 N LONG. 132-05 E. Sighted tops of ships, bearing 205°T, visibility variable with rain squalls and haze. c/c to close and commenced tracking. Contact was large fleet tanker with 4 escorts. One escort was quite large, appearing to be an AK about 1/4 as big as the tanker. Due to variable visibility we had closed too much before sighting him, and the target challenged us."
  page: "16"
  flags: "The heading numbers this SHIP CONTACT #9; the contact table numbers it 10 (its contact 9 is the 29 October sampans). The heading's position is the table's (contact 10)."
- date: "30 October"
  time: "0712"
  zone: "I"
  part: "I"
  event: "c/c to 000 to open, and the convoy fell in astern of us, distance 10 miles."
  page: "16"
- date: "30 October"
  time: "0800"
  zone: "I"
  part: "I"
  event: "Had finally worked our way out to 17 miles and had only his tops in sight bearing 230°T through periscope."
  page: "16"
- date: "30 October"
  time: "0805"
  zone: "I"
  part: "I"
  event: "Enemy grew suspicious apparently, and changed base course to 070. Maneuvered to get ahead again."
  page: "16"
- date: "30 October"
  time: "0900"
  zone: "I"
  part: "I"
  event: "In position ahead about 17 miles. Enemy changed base course to 340°T, thereby throwing us on his beam again. Proceeded to get back ahead at full speed."
  page: "16"
- date: "30 October"
  time: "1020"
  zone: "I"
  part: "I"
  event: "Ahead in position - enemy changed base course to 020°T. Proceeded to get ahead again at full speed. This convoy was smart. We have to stay 15 to 18 miles ahead to stay out of sight, and his changes of base course were just irregular enough to prevent our pre-estimating a place to dive. Each base course change had placed us on his beam necessitating a long full power run to get ahead again."
  page: "16"
- date: "30 October"
  time: "1125"
  zone: "I"
  part: "I"
  event: "Received message from SILVERSIDES saying she had attacked with 1 premature."
  page: "16"
- date: "30 October"
  time: "1200"
  zone: "I"
  tag: "rendezvous"
  title: "SALMON in sight"
  with: "SALMON"
  part: "I"
  event: "Sighted SALMON on bearing 200°T, range 10 miles."
  page: "16"
- date: "30 October"
  time: "1330"
  zone: "I"
  part: "I"
  event: "Target disappeared in rain squall - bearing 265, manned S.J. radar."
  page: "16"
- date: "30 October"
  time: "1403"
  zone: "I"
  part: "I"
  event: "Radar bearing 229°T, range 28,000 yds., showing he had zigged to 100°T. He had changed 140° in base course after entering rain squall. This bearing in a heavy sea and heavy rainstorm was a combination of luck and skill. Sent contact message for which no one receipted. Commenced closing at high speed on his normal approach course. With range 18,000, convoy c/c to 040°T. We were on reverse bearing. Rain lifted and we dove. A long persistent chase had been rewarded. We finally had the rat cornered - now we'll see how he fights; Weather was roughening up with waves 6 to 8 feet in height. We were headed into the sea and wind and had difficulty holding depth at 60' (broached to 36 feet once but not sighted.). When targets came into sight in periscope, four escorts were seen, one being a small freighter, The big tanker was zigging back and forth in center of escorts who were arranged on each quarter. Escorts would zig about once for each of 2 zigs of the tanker making the approach damn difficult."
  page: "17"
- date: "30 October"
  time: "1558"
  zone: "I"
  part: "I"
  event: "Range 4600 on tanker, angle on bow 10 Port on 2 starboard escorts, and 5 Starboard on tanker, came to 180°T, 45's to his course to open track intending to fire high parallax if he did not zig back, or gambling on a zig to his right if he did zig at all."
  page: "17"
- date: "30 October"
  time: "1600"
  zone: "I"
  part: "I"
  event: "With range 4400, periscope dipped just as target was beginning a zig to his right. He gave us a 45 port angle which was a perfect set up for the bow tubes except for the range, which would be long. It was now or never, though. The port escorts were pinging on us with angles on the bow of 10 Port and zero."
  page: "17"
- date: "30 October"
  time: "1605"
  zone: "I"
  part: "I"
  event: "Maneuvered around escort who was pinging on us, zero angle on bow."
  page: "17"
- date: "30 October"
  time: "1609"
  zone: "I"
  part: "I"
  event: "Unable to see target as escort was in way."
  page: "17"
- date: "30 October"
  time: "1610"
  zone: "I"
  tag: "attack"
  title: "Attack 1: six bow torpedoes, all missed"
  part: "I"
  event: "With range 4,000 yds., angle on the bow 90 port and torpedo run too great, commenced firing the bow tubes gambling on one of them having a long run. We were firing into the wind and sea. (Just prior to firing at the tanker, one escort had crossed our bow and we almost fired at him, all fish being set on 4 feet. We let him go by, however, and there was not time to change the depth settings back to greater depth). One torpedo broached all the way down the range: alerting the tanker who zigged left, toward us, swinging fast. We were swinging right and settled on course 270°T. The tanker headed across our stern on course 000°T at increased speed. All forward tubes had missed."
  page: "17"
- date: "30 October"
  time: "1615"
  zone: "I"
  tag: "attack"
  title: "Attack 1: four stern torpedoes, four hits"
  part: "I"
  event: "Commenced firing after tubes with range 1400 yds., angle on bow 90, course 000°T, speed 14 knots. 2 minutes later heard first torpedo hit. Raised scope and observed 2 more hits, all in stern which was obliterated by smoke and flying debris. Smoke cleared to show a portion of the stern gone. His screws stopped never to turn again. Fourth fish hit, but I was looking at an escort who had turned toward us with a zero angle on bow and a bone in his teeth, Retired to safer depth, 320 feet; where our inductions would be safer, and while passing 120 feet heard a tremendous explosion which was not a depth charge, and which rumbled and crackled for about 20 seconds to the accompaniment of heavy minor explosions. While going deep, 3 more escorts joined the chase, and as we hit 200', the first escort made a beautiful run and dropped a pattern over us followed by other escorts in quick succession. The 4th escort, presumably the AK, stayed off to the side apparently coaching. The encirclement method was employed, and we were boxed in very quickly. A 3 degree negative temperature gradient was found starting at 250 feet. Stayed at standard speed heading for escort who had made the last run. This course was into the wind and sea and away from the tanker, giving the SALMON a chance to get in and finish the tanker or AK. Slowed to 2/3 speed, which was maintained throughout the evasion tactics. During the next hour, 78 depth charges were dropped, all pretty close, screws were heard on at least two runs passing overhead, once close aboard down the stbd side, and the rest astern."
  page: "17"
  flags: "Runs onto page 18 ('1615 (I) Cont'd.'). The narrative counts 78 depth charges; Part J counts 70. The torpedo attack form gives the attack at 1615 (I), 30-14 N 132-50 E."
- date: "30 October"
  time: "1617"
  zone: "I"
  tag: "counterattack"
  title: "Depth-charged after the tanker attack"
  lat: "30-14 N"
  lon: "132-50 E"
  part: "VIII"
  charges: "70"
  event: "The enemy counter-measures encountered on the attack of 30 October were very good during the first phase. Immediately after the first torpedo explosion, one escort made a beautiful run directly over us and dropped about 7 charges overhead as we passed 200 feet helping us to go deeper, and a second escort dropped a pattern overhead as we passed 300 feet. Settled at 320 feet. Escorts continued runs on us until a total of 70 charges were dropped, each pattern falling progressively farther astern. Immediately after the first pattern, a string of about 20 light explosions were heard at about 1 second intervals. The encirclement method was used with 3 escorts circling and pinging and one listening. We held 2/3 speed and a southeasterly course between changes of course to put tail to attacking escort, and after two hours, put escorts astern. S.E. course was into wind and sea. Negative temperature gradient was 3° with a good layer at 320 feet. Predicted echo range was 1700 yds. at 320 feet. Course drew escorts away from crippled tanker, but evasion tactics were too successful as escorts were back at tanker at 1915 in time to detect the SALMON making an approach. These escorts had no radar, however, radar was used by the heavy ships encountered on 26 October."
  page: "29"
  flags: "Part (J), Anti-Submarine Measures and Evasion Tactics, page 29. No time is given; 1617 is the first hit, two minutes after the 1615 firing. Position from Part (O), page 33: 'Only one dive was made deep enough to obtain a bathythermograph card ... on 30 October 1944, at Lat. 30-14 N, Long. 132-50 E', the attack form's position. The narrative counts 78 depth charges. Part (K) and the narrative 1855 entry record the antenna trunk flooded by the depth charges."
- date: "30 October"
  time: "1730"
  zone: "I"
  part: "I"
  event: "Escorts were falling slowly astern, our course 150°T, so made reload and started up only to have one escort start toward us."
  page: "18"
- date: "30 October"
  time: "1800"
  zone: "I"
  part: "I"
  event: "Started up again."
  page: "18"
- date: "30 October"
  time: "1855"
  zone: "I"
  part: "I"
  event: "Surfaced. 3 pips on radar at 15,000 yds., bearing 300°T. We were in the moon slick but luckily had a bad horizon behind us. Headed north with two engines on charge and two on propulsion to get in position for another attack if opportunity presented itself. Antenna trunk was flooded out, so we had only the S.D. radar mast, and sent out serial four to COMSUBPAC, and reports to other submarines on wolfpack frequency. Received no reply. During this time, we were getting snatches of messages showing that SALMON, SILVERSIDES, and STERLET were making a coordinated attack. Held off closing to get more dope on their positions."
  page: "18"
- date: "30 October"
  time: "2140"
  zone: "I"
  tag: "rendezvous"
  title: "STERLET passed in the dark"
  with: "STERLET"
  part: "I"
  event: "Saw gunfire bearing 180°T. Unable to raise SALMON or SILVERSIDES. Commenced closing gun flashes. Picked up S.J. radar interference ahead. Challenged on S.J., but got no reply. Decided to go around this stranger, but he was between us and the gun flashes and it was a long process. This sub was later identified as the STERLET proceeding towards target. STERLET reported putting 4 hits in tanker we had hit. Why it didn't sink before, with that tremendous explosion, we will never know. Sent latest dope to COMSUBPAC and all submarines."
  page: "18"
- date: "31 October"
  time: "0250"
  zone: "I"
  part: "I"
  event: "Received message from Compac 17-17 directing rendezvous at Lat. 31-20 N, 134-00 E, stating ⟦TU17-17-1⟧ will await SALMON. Headed for rendezvous."
  page: "19"
  flags: "31-20 N 134-00 E is the rendezvous ordered, not the boat's position. The task unit is read 'TU17-17-1' (Qwen) / 'TUL7-17=l' (Bonsai)."
- date: "31 October"
  time: "0315"
  zone: "I"
  part: "I"
  event: "Received STERLET transmission - SALMON unable to dive. This was our first indication that SALMON was in trouble."
  page: "19"
- date: "31 October"
  time: "0420"
  zone: "I"
  part: "I"
  event: "Received message from Compac 17-17 giving SALMON 2326 (I) posit. as 30-19 N, 133-08 E, course 330 to 0, and unable to dive. Changed course to close that position."
  page: "19"
  flags: "The position is SALMON's. 'to 0' (Bonsai; Qwen read 'O')."
- date: "31 October"
  time: "0515"
  zone: "I"
  part: "I"
  event: "Radar contact bearing 145°T, distance 10 miles. 3 small pips showed up. Tracked them while working our way around them."
  page: "19"
- date: "31 October"
  time: "0540"
  zone: "I"
  part: "I"
  event: "Received message from Compac 17-17 with SALMON 0500 (I) position as 29-25 N, 132-45 E, course 130°T, speed 12. Changed course to intercept."
  page: "19"
  flags: "The position is SALMON's."
- date: "31 October"
  time: "0605"
  zone: "I"
  part: "I"
  event: "Sighted 3 escorts from last nights party on course 000. Sent out contact report, and continued for SALMON's estimated 1400 posit on course 158°T."
  page: "19"
- date: "31 October"
  time: "0803"
  zone: "I"
  tag: "rendezvous"
  title: "SILVERSIDES in sight"
  with: "SILVERSIDES"
  part: "I"
  event: "Sighted SILVERSIDES bearing 106°T. She slowly worked her way over to our starboard beam, distance about 12 miles."
  page: "19"
- date: "31 October"
  time: "1140"
  zone: "I"
  part: "I"
  event: "Received new position report from SALMON - changed course to intercept."
  page: "19"
- date: "31 October"
  time: "1322"
  zone: "I"
  part: "I"
  event: "Received new position report from SALMON - changed course to intercept. Course now 148°T, and we could not intercept before 2300."
  page: "19"
- date: "31 October"
  time: "1730"
  zone: "I"
  part: "I"
  event: "Picked up interference on S.J. bearing 275°T from SILVERSIDES which showed up remainder of night."
  page: "19"
- date: "31 October"
  time: "1958"
  zone: "I"
  part: "I"
  event: "Received message from SALMON saying she would stop at 2000 (I) at 26-?? N, 136-16 E. Minutes of latitude in this message was garbled, but assumed 30 minutes, which turned out to be nearly correct. Headed for that spot. SILVERSIDES reported STERLET was on his stbd beam. SALMON commenced homing us in by transmitting true bearings of radar interference from her. Her S.J. receiver being in operation, but transmitter out."
  page: "19"
  flags: "The position is SALMON's, typed '26-?? N' as the garbled message gave it."
- date: "31 October"
  time: "2222"
  zone: "I"
  part: "I"
  event: "Sighted red flare bearing 010°T, changed course to close."
  page: "19"
- date: "31 October"
  time: "2245"
  zone: "I"
  tag: "rendezvous"
  title: "Alongside the damaged SALMON"
  with: "SALMON"
  part: "I"
  event: "All stop - alongside SALMON. STERLET was sighted bearing 160°T closing fast - exchanged recognition signals."
  page: "19"
  flags: "Near SALMON's 2000 (I) stopping point, 26-30 N 136-16 E as the report assumes it; Part M puts the boat at 29-21 N 134-04 E at 2100, about 200 miles away, which cannot be right."
- date: "31 October"
  time: "2341"
  zone: "I"
  tag: "rendezvous"
  title: "SALMON's executive officer aboard"
  with: "SALMON"
  part: "I"
  event: "Lieutenant LANING, USN., executive officer, U.S.S. SALMON, and 2 men came aboard. SALMON was making emergency repairs to engines and would get underway at 0000 - We had been trying to raise SILVERSIDES since 2200 but were unable to contact her."
  page: "19"
  flags: "Runs onto page 20 ('2341 (I) Cont'd.')."
- date: "1 November"
  time: "0010"
  zone: "I"
  tag: "counterattack"
  title: "Two torpedoes from a Japanese submarine"
  part: "I"
  event: "STERLET reported 2 torpedoes heading north. All ahead emergency to avoid. Sighted wakes from bridge passing astern of TRIGGER and ahead of STERLET who was bearing 250°T at the time. Commenced closing area. Sent message to SILVERSIDES, but it was not received for."
  page: "20"
- date: "1 November"
  time: "0559"
  zone: "I"
  tag: "counterattack"
  title: "Torpedo wake on the starboard beam"
  part: "I"
  event: "Lookout sighted torpedo wake on stbd beam passing aft. Avoided. Decided this was a very unhealthy area so decided to clear it at SALMON's best speed and send rendezvous message to SILVERSIDES following night if she didn't show up before. Set course 157°T to head for SAIPAN safety lane at 16 kts."
