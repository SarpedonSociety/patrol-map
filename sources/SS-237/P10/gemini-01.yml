  event: "Lost sight contact 350°T."
  page: "14"
- date: "26 October"
  time: "0950"
  zone: "I"
  part: "I"
  event: "Sighted smoke bearing 320°T - c/c to 320°T and cleared message to SILVERSIDES giving him the latest dope. Task force was now on course 320°T, and had speeded up to 19 or 20 knots, and was apparently heading for the slot between MIYAKO JIMA and TARAMA JIMA."
  page: "14"
  flags: "TARAMA (Bonsai); Qwen read TARANA. Qwen read 'speeded', Bonsai 'sped'."
- date: "26 October"
  time: "1040"
  zone: "I"
  part: "I"
  event: "No trace of the enemy had been seen for the last 50 minutes so gave up the chase and came to course 130°T feeling completely thwarted for the 4th time in 6 days. Had the HALIBUT's contact report contained her position at time of sighted perhaps we could have been in a better position for interception at dawn, as this error cost us 45 valuable minutes and was enough to cause us to miss a position ahead."
  page: "14"
