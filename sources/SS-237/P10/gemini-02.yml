Narrative of the Addenda (the second part of the patrol, the anti-patrol vessel sweep of TG 17.24 east and north of
the BONIN ISLANDS, 10-23 November 1944), typed pages 1-5a of the Addenda (scan files WP10.38-WP10.43). Not raw
Gemini output: Claude's restructuring of the OCR working transcription (Qwen3-VL 8B checked against Ternary Bonsai
27B) on 2026-11-13, on the same terms as gemini-01.yml. The Addenda number their pages afresh ('- 1 -' to '- 10 -',
with a '- 5a -'); to keep them apart from the first part's pages they are given here as A1-A5 and A5a. All times
are typed (I).

