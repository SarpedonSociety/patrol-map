# USS Trigger (SS-237), War Patrol 10 — handoff notes for the build session. Not yet built: there is no patrol.yml
# or gemini-*.yml in this folder, so the converter skips it. Written by Claude on 2026-11-13 from the OCR working
# transcription (Qwen3-VL 8B checked against Ternary Bonsai 27B; vault note 'SS-237 Trigger - War Patrol 10 - OCR',
# 53 pages WP10.1-WP10.53) and the PSO's hand readings of the same day. check-contacts-wp10-44.md is the second read
# of page WP10.44 (Addendum Part F) the PSO supplied; the converter ignores it.
#
# Report: Serial 033 of 3 Nov 1944 (first part, 24 Sep - 3 Nov, east coast of Formosa and southern Nansei Shoto);
# Addenda Serial 034 of 23 Nov 1944 (second part, 10-23 Nov, east and north of the Bonins). CO F.J. Harlfinger II.
# 1st endorsement ComSubRon 10 / ComSubDiv 101 (G.L. Russell), Serial 0254, 28 Nov 1944: recommends 1 converted
# tanker damaged, about 14,000 tons. 2nd endorsement COMSUBPAC (C.A. Lockwood Jr.), Serial 02762, 8 Dec 1944,
# Patrol Report No. 591: SUNK 1/3 - Large Tanker - 3,300 tons (Attack No. 1). Combat insignia authorized.
# Departure Pearl Harbor 1329 (VW) 24 Sep; Saipan 3-5 Oct (sailed 0554 (I) 5 Oct, a day after SILVERSIDES and SALMON,
# with SEADRAGON); area 11C entered 1400 (I) 9 Oct at 23-00 N 125-05 E; moored alongside HOLLAND, outboard of
# STERLET, TANAPAG HARBOR, 2030 (I) 3 Nov; underway from Saipan 1620 (I) 10 Nov (TG 17.24, with BESUGO as well);
# moored stbd side to SPERRY, APRA Harbor, GUAM, 0640 (I) 23 Nov.
# The index note INDEX SS.237.10 gives base_in Pearl Harbor and 5 days submerged; the report has Guam and 15.
#
# PSO's hand readings, 13 November 2026:
# - Part F ship contacts (WP10.23) dates: 1 10-8-44; 2 10-10-44; 3 10-12-44; 4 10-18-44; 5 10-18-44; 6 10-24-44;
#   7 10-26-44; 8 10-27-44; 9 10-29-44; 10 10-30-44. Ranges: 3 8,500; 5 16,000; 8 8,000.
#   Contacts 4 and 5 are typed 10-18-44, but the narrative (19 October) and the 1st endorsement put the SHIGURE DD
#   and the task force on 19 October. Plot on the 19th; keep the table date with a note.
# - Ship contact 7 (table): 0836 (I) 26 Oct, 24-07 N 125-41 E (the 5 could be a 6; PSO reads 5). Aircraft contact
#   25 at 0900, 26 Oct, is 24-07 N 125-41 E. The narrative heading reads 24-97 (Qwen) / 24-57 (Bonsai) N 125-41 E;
#   keep as typed with a discrepancy note.
# - Aircraft 17: 19 Oct, 25-20.4 N 122-09 E (PSO). The PSO gave the time as 1658, but both OCR reads have 1232 for
#   17 (1658 is aircraft 16, 15 Oct) and the narrative puts PLANE CONTACT #17 (the float plane) at 1332. Ask the
#   PSO to read the time again.
# - Aircraft 18: 25-00 N (a faded 0 read as C by Qwen). Aircraft 23 and 24: longitudes printed W (122-17W,
