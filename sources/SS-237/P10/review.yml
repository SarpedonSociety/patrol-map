# Decisions (PSO, 13 November 2026):
# - 17 Nov 1520-1540 gun approach (closing from astern, forced down by a plane before firing): an event, not a gun
#   attack marker. Gun attacks are plotted only where the report has a gun attack data page.
# - 15 Nov joint gun attack with SILVERSIDES and STERLET: TRIGGER fired 112 rounds of 4", no hits, no gun attack
