# Patrol report inventory: what exists, where, and how far along it is.
#
# status:  missing      no report found yet
#          available    report found, not yet transcribed
#          transcribed  Gemini or hand transcription saved in sources/
#          verified     checked against the report
#          mapped       on the map
#          no-report    no report exists (e.g. boat lost on this patrol)
# found_in: where the report was found (Fold3 COMSUBPAC collection, Fold3 ship
#          collection, NARA, maritime.org, ...)
# start/end: patrol dates once known (from the report's first narrative
#          entries), e.g. 1942-07-15. Used to find overlapping patrols.

